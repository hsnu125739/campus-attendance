      const prevSnapshot = captureCampusSnapshot();

      // 重新校準該分類所有校園的 sort 為連續遞增 1, 2, 3...
      categoryCampuses.sort((a, b) => (a.sort || 0) - (b.sort || 0));
      categoryCampuses.forEach((c, i) => {
        c.sort = i + 1;
      });

      renderCampuses();
      scheduleCampusSync(prevSnapshot);
    }

    /** 更新首頁底部管理按鈕群組與頂部切換列顯示狀態 */
    function updateCampusFooterUI() {
      const isEditing = !!state.campusEditMode;
      const manageBtn = document.getElementById('btn-manage-campus');
      const saveBtn = document.getElementById('btn-save-campus');
      const addBtn = document.getElementById('btn-add-campus');
      const restoreBtn = document.getElementById('btn-restore-campus');
      const topNavBar = document.getElementById('top-nav-bar');

      if (manageBtn) manageBtn.style.display = isEditing ? 'none' : '';
      if (saveBtn) saveBtn.style.display = isEditing ? '' : 'none';
      if (addBtn) addBtn.style.display = isEditing ? '' : 'none';
      if (topNavBar) topNavBar.style.display = isEditing ? 'none' : '';

      if (restoreBtn) {
        const archivedCount = (state.archivedCampuses && state.archivedCampuses.length) ? state.archivedCampuses.length : 0;
        if (isEditing && archivedCount > 0) {
          restoreBtn.style.display = '';
          restoreBtn.textContent = `📂 恢復封存小排 (${archivedCount})`;
        } else {
          restoreBtn.style.display = 'none';
        }
      }
    }

    /** 進入小排管理模式 */
    function enterCampusEditMode() {
      state.campusEditMode = true;
      state.campusesSnapshot = JSON.stringify(state.campuses);
      updateCampusFooterUI();
      renderCampuses();
    }

// ===== 小排管理同步委派 (委派至 CampusStore 前端深模組) =====

    /**
     * 建立當前啟用與封存校園的快照 (委派至 CampusStore)
     * @returns {{ campuses: Array, archivedCampuses: Array }}
     */
    function captureCampusSnapshot() {
      if (typeof campusStore !== 'undefined') {
        return campusStore.captureSnapshot(state.campuses, state.archivedCampuses);
      }
      return {
        campuses: JSON.parse(JSON.stringify(state.campuses || [])),
        archivedCampuses: JSON.parse(JSON.stringify(state.archivedCampuses || []))
      };
    }

    /**
     * 取得目前待同步的小排操作數 (委派至 CampusStore)
     * @returns {number}
     */
    function getCampusPendingCount() {
      return (typeof campusStore !== 'undefined') ? campusStore.getPendingCount() : 0;
    }

    /**
     * 排程小排清單同步 (委派至 CampusStore)
     * @param {Object} [prevSnapshot] 操作前快照
     * @param {boolean} [immediate=false] 是否立即同步
     */
    function scheduleCampusSync(prevSnapshot, immediate = false) {
      if (typeof campusStore !== 'undefined') {
        campusStore.scheduleCampusSync(prevSnapshot, immediate);
      }
    }

    /**
     * 立即送出小排清單變更至後端 (委派至 CampusStore)
     * @returns {Promise<void>}
     */
    function flushCampusSync() {
      if (typeof campusStore !== 'undefined') {
        return campusStore.flushCampusSync(state.campuses, state.archivedCampuses);
      }
    }

    /**
     * 比對兩個校園清單是否實質相等 (委派至 CampusStore)
     * @param {Array} listA
     * @param {Array} listB
     * @returns {boolean}
     */
    function areCampusListsEqual(listA, listB) {
      if (typeof campusStore !== 'undefined') {
        return campusStore.areCampusListsEqual(listA, listB);
      }
      return false;
    }

    /** 退出小排管理模式 */
    function exitCampusEditMode() {
      if (typeof campusStore !== 'undefined' && campusStore.hasPendingSync()) {
        campusStore.flushCampusSync(state.campuses, state.archivedCampuses);
      }
      state.campusEditMode = false;
      state.campusesSnapshot = null;
      updateCampusFooterUI();
      renderCampuses();
    }

    /** 新增校園（0ms 樂觀更新 + 防抖背景同步，由 CampusStore 驅動） */
    function handleAddCampus() {
      const name = document.getElementById('input-campus-name').value.trim();
      const category = getSelectedCampusCategory('add');
      if (!name) { showToast('請輸入小排名稱', 'error'); return; }
      if (!category) { showToast('請選擇分類', 'error'); return; }

      // 檢查名稱是否重複
      if (state.campuses.some(c => c.name === name)) {
        showToast('小排名稱已存在於啟用清單', 'error');
        return;
      }

      // 計算同分類最大 sort
      let maxSort = 0;
      state.campuses.forEach(c => {
        if (c.category === category && (c.sort || 0) > maxSort) {
          maxSort = c.sort;
        }
      });

      const prevSnapshot = captureCampusSnapshot();

      const newId = generateLocalCampusId(category);
      state.campuses.push({
        id: newId,
        name: name,
        category: category,
        sort: maxSort + 1,
        isArchived: false
      });

      closeModal('modal-add-campus');
      renderCampuses();
      scheduleCampusSync(prevSnapshot);
      showToast(`已新增「${name}」`, 'success');
    }

    /** 刪除校園（標記為封存，0ms 自動同步） */
    function handleDeleteCampus(campusId, name) {
      const idx = state.campuses.findIndex(c => c.id === campusId);
      if (idx === -1) return;

      const prevSnapshot = captureCampusSnapshot();

      const archivedItem = state.campuses.splice(idx, 1)[0];
      archivedItem.isArchived = true;
      if (!state.archivedCampuses) state.archivedCampuses = [];
      state.archivedCampuses.push(archivedItem);

      renderCampuses();
      scheduleCampusSync(prevSnapshot);
      showToast(`已將「${name}」移至封存`, 'success');
    }

    // ===== 恢復封存校園 =====
    /** 開啟恢復封存小排對話框 */
    function openRestoreCampusModal() {
      const container = document.getElementById('restore-campus-list');
      container.innerHTML = '';
      if (!state.archivedCampuses || state.archivedCampuses.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">目前無任何封存小排</div>';
        openModal('modal-restore-campus');
        return;
      }

      state.archivedCampuses.forEach(campus => {
        const item = document.createElement('div');
        item.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;';
        const info = document.createElement('div');
        info.innerHTML = `<span style="font-weight:600;color:#1e293b;">${campus.name}</span> <span style="font-size:12px;color:#64748b;margin-left:6px;">(${campus.category || '其他'})</span>`;
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary btn-sm';
        btn.textContent = '恢復';
        btn.style.padding = '4px 12px';
        btn.onclick = () => handleRestoreCampus(campus.id, campus.name);
        item.appendChild(info);
        item.appendChild(btn);
        container.appendChild(item);
      });

      openModal('modal-restore-campus');
    }

    /**
     * 執行恢復已封存小排（0ms 樂觀更新 + 防抖背景同步，由 CampusStore 驅動）
     * @param {string} campusId 校園 ID
     * @param {string} name 校園名稱
     */
    function handleRestoreCampus(campusId, name) {
      const idx = state.archivedCampuses.findIndex(c => c.id === campusId);
      if (idx === -1) return;

      const prevSnapshot = captureCampusSnapshot();

      const restored = state.archivedCampuses.splice(idx, 1)[0];
      restored.isArchived = false;
      state.campuses.push(restored);
      state.campuses.sort((a, b) => {
        if (a.category === '高中' && b.category !== '高中') return -1;
        if (a.category !== '高中' && b.category === '高中') return 1;
        return (a.sort || 0) - (b.sort || 0);
      });

      closeModal('modal-restore-campus');
      renderCampuses();
      scheduleCampusSync(prevSnapshot);
      showToast(`已成功恢復「${name}」小排`, 'success');
    }

    // ===== 校園編輯 =====

    /** 開啟校園編輯 modal */
    function openRenameCampusModal(campusId, currentName) {
      const campus = state.campuses.find(c => c.id === campusId);
      document.getElementById('rename-campus-id').value = campusId;
      document.getElementById('input-rename-campus').value = campus ? campus.name : currentName;
      const currentCat = campus ? (campus.category || '高中') : '高中';
      setCampusCategorySelector('edit', currentCat);
      openModal('modal-rename-campus');
    }

    /** 處理校園編輯（0ms 樂觀更新 + 防抖背景同步，由 CampusStore 驅動） */
    function handleRenameCampus() {
      const campusId = document.getElementById('rename-campus-id').value;
      const newName = document.getElementById('input-rename-campus').value.trim();
      const newCategory = getSelectedCampusCategory('edit');

      if (!newName) { showToast('請輸入小排名稱', 'error'); return; }
      if (!newCategory) { showToast('請選擇小排類別', 'error'); return; }

      // 檢查新名稱是否被其他校園使用
      if (state.campuses.some(c => c.id !== campusId && c.name === newName)) {
        showToast('小排名稱已存在', 'error');
        return;
      }

      const campus = state.campuses.find(c => c.id === campusId);
      if (!campus) return;

      // 若名稱與類別皆無變更，直接關閉彈窗，避免無意義儲存
      if (campus.name === newName && (campus.category || '高中') === newCategory) {
        closeModal('modal-rename-campus');
        return;
      }

      const prevSnapshot = captureCampusSnapshot();

      const oldCategory = campus.category;
      campus.name = newName;
      if (oldCategory !== newCategory) {
        campus.category = newCategory;
        // 若跨分類移動，將其排序設為新分類的最後一位
        const sameCatCampuses = state.campuses.filter(c => c.category === newCategory && c.id !== campusId);
        const maxSort = sameCatCampuses.reduce((max, c) => Math.max(max, c.sort || 0), 0);
        campus.sort = maxSort + 1;
      }

      closeModal('modal-rename-campus');
      renderCampuses();
      scheduleCampusSync(prevSnapshot);
      showToast(`已更新「${newName}」`, 'success');
    }

    // ===== 確認動作對話框 =====
    /**
     * 開啟通用確認動作 Modal 對話框
     * @param {string} title 對話框標題
     * @param {string} messageHtml 提示 HTML 內容
     * @param {string} btnText 確認按鈕文字（預設 '確認'）

    function handleConfirm() {

    // ===== 頁面 2：點名 =====

    /** 進入點名頁面（0 毫秒瞬間切換） */
    function enterAttendancePage(campusId, campusName) {
      state.currentCampusId = campusId;
      state.currentCampus = campusName;
      state.weekOffset = 0;
      state.memberEditMode = false;
      updateEditMemberBtn();
      resetFilter();

      // 從前端全域快取立即取出該校資料 (0 毫秒)

      if (typeof sortMemberList === 'function') {
        sortMemberList(state.members);
      }

    /** 返回首頁（0 毫秒瞬間切換） */

// ===== 統計與趨勢頁面狀態管理（以週日代表各週區間，迄日不超過要來之週日） =====
    const statsState = {
      currentTab: 'home',
      rangeMode: 'W10',        // 'W10' | 'W20' | 'SEMESTER_CURRENT' | 'SEMESTER_SPRING' | 'SEMESTER_AUTUMN' | 'ALL' | 'CUSTOM'
      startDate: '',           // 'YYYY-MM-DD' 當前生效的起始週日
      endDate: '',             // 'YYYY-MM-DD' 當前生效的結束週日
      selectedCampusId: 'ALL',
      excludeSuspended: false, // 排除暫停週開關（預設未勾選，僅限各校模式）
      activeMetrics: {
        attend: true,
        gospel: true,
        pray: false,
        outreach: false
      },
      chartInstance: null,
      tableSort: {
        column: 'avgAttend',
        direction: 'desc'
      },
      lastReport: null
    };

    /** 取得給定日期的週一日期（委派至 Timeline 工具） */
    function getMonday(date) {
      return Timeline.getMonday(date);
    }

    /** 取得給定日期所在週的週日日期（代表該週日期，委派至 Timeline 工具） */
    function getSunday(date) {
      return Timeline.getSunday(date);
    }

    /** 取得當前週的最新週日字串（最大可選迄日，委派至 Timeline 工具） */
    function getMaxAllowedSundayStr() {
      return Timeline.getMaxAllowedSundayStr();
    }

    /** 主導航切換：首頁 (home) vs 趨勢統計 (stats) */
    function switchMainTab(tabName) {
      statsState.currentTab = tabName;
      const tabHome = document.getElementById('tab-nav-home');
      const tabStats = document.getElementById('tab-nav-stats');
      const pageHome = document.getElementById('page-home');
      const pageStats = document.getElementById('page-stats');
      const pageAttendance = document.getElementById('page-attendance');
      const mainHeader = document.getElementById('main-view-header');
      const subTitle = document.getElementById('main-app-subtitle');
      mainHeader.style.display = 'block';
      pageAttendance.style.display = 'none';
      if (tabName === 'home') {
        tabHome.classList.add('active');
        tabStats.classList.remove('active');
        pageHome.style.display = 'block';
        pageStats.style.display = 'none';
        subTitle.textContent = '選擇小排開始點名';
      } else {
        tabStats.classList.add('active');
        tabHome.classList.remove('active');
        pageHome.style.display = 'none';
        pageStats.style.display = 'block';
        subTitle.textContent = '各校數據趨勢與即時統計';

        // 第一次進入時初始化預設 10 週範圍
        if (!statsState.startDate || !statsState.endDate) {
          applyPresetRange('W10', false);
        }

        renderStatsPage();
      }
    }

    /** 依預設模式計算並設定底層 [startDate, endDate]（均為週日），並自動同步至自訂輸入框 */
    async function applyPresetRange(mode, triggerRender = true) {
      statsState.rangeMode = mode;
      const now = new Date();
      if (mode === 'W10') {
        const range = Timeline.recentWeeks(10, now);
        statsState.startDate = range.startDate;
        statsState.endDate = range.endDate;
      } else if (mode === 'W20') {
        const range = Timeline.recentWeeks(20, now);
        statsState.startDate = range.startDate;
        statsState.endDate = range.endDate;
      } else if (mode === 'SEMESTER_CURRENT' || mode === 'SEMESTER_SPRING' || mode === 'SEMESTER_AUTUMN') {
        const term = (mode === 'SEMESTER_SPRING') ? 'SPRING' : ((mode === 'SEMESTER_AUTUMN') ? 'AUTUMN' : 'CURRENT');
        const range = Timeline.semester(now.getFullYear(), term, now);
        statsState.startDate = range.startDate;
        statsState.endDate = range.endDate;
      } else if (mode === 'ALL') {
        if (attendanceStore.minLoadedWeek && attendanceStore.minLoadedWeek !== '0000-00-00' && attendanceStore.minLoadedWeek !== '__ALL__') {
          await ensureAttendanceRange('');
        }
        let earliest = Timeline.getMaxAllowedSundayStr(now);
        for (const [cid, recList] of Object.entries(attendanceStore.attendanceByCampus || {})) {
          for (const r of recList) {
            if (r.week) {
              const sunStr = Timeline.formatDate(Timeline.getSunday(r.week));
              if (sunStr < earliest) earliest = sunStr;
            }
          }
        }

        statsState.startDate = earliest;
        statsState.endDate = Timeline.getMaxAllowedSundayStr(now);
      }

      // 若指定區間早於快取最舊週，按需抓取更早歷史
      if (mode !== 'ALL' && statsState.startDate && attendanceStore.minLoadedWeek && attendanceStore.minLoadedWeek !== '0000-00-00' && attendanceStore.minLoadedWeek !== '__ALL__' && statsState.startDate < attendanceStore.minLoadedWeek) {
        await ensureAttendanceRange(statsState.startDate);
      }

      // 同步填入自訂起訖輸入框
      syncDateInputs();

      // 控制自訂列展開/隱藏
      const customBar = document.getElementById('stats-custom-range-bar');
      if (customBar) {
        customBar.style.display = (mode === 'CUSTOM' ? 'flex' : 'none');
      }

      if (triggerRender) {
        renderStatsPage();
      }
    }

    /** 將當前生效的 startDate 與 endDate (週日) 同步寫入 input，並設定 max 限制不可超過本週日 */
    function syncDateInputs() {
      const maxSunStr = getMaxAllowedSundayStr();
      const sInput = document.getElementById('stats-custom-start');
      const eInput = document.getElementById('stats-custom-end');
      if (sInput) {
        sInput.max = maxSunStr;
        if (statsState.startDate) sInput.value = statsState.startDate;
      }

      if (eInput) {
        eInput.max = maxSunStr;
        if (statsState.endDate) eInput.value = statsState.endDate;
      }
    }

    /** 切換區間下拉選單 */
    function handleStatsRangeModeChange() {
      const sel = document.getElementById('stats-range-select');
      const mode = sel.value;
      if (mode === 'CUSTOM') {
        statsState.rangeMode = 'CUSTOM';

        // 切換成自訂起訖時，自動將目前已經顯示的範圍填入輸入框！
        syncDateInputs();
        const customBar = document.getElementById('stats-custom-range-bar');
        if (customBar) customBar.style.display = 'flex';
        renderStatsPage();
      } else {
        applyPresetRange(mode, true);
      }
    }

    /** 套用自訂起訖日期（以週日為準，且限制不可超過要來之週日） */
    async function applyCustomDateRange() {
      const sInputVal = document.getElementById('stats-custom-start').value;
      const eInputVal = document.getElementById('stats-custom-end').value;
      if (!sInputVal || !eInputVal) {
        showToast('請選擇完整的開始與結束日期', 'error');
        return;
      }

      // 轉換成各自所屬週的週日
      const sSun = getSunday(sInputVal);
      let eSun = getSunday(eInputVal);
      const maxSun = getSunday(new Date());
      if (eSun > maxSun) {
        eSun = maxSun;
        showToast(`結束日期不可超過要來之週日（${formatDate(maxSun)}），已自動校準`, 'warning');
      }

      if (sSun > eSun) {
        showToast('開始日期不能晚於結束日期', 'error');
        return;
      }

      statsState.rangeMode = 'CUSTOM';
      statsState.startDate = formatDate(sSun);
      statsState.endDate = formatDate(eSun);
      syncDateInputs();
      const sel = document.getElementById('stats-range-select');
      if (sel) sel.value = 'CUSTOM';

      // 若自訂起訖超出當前快取，自動補抓歷史
      if (attendanceStore.minLoadedWeek && attendanceStore.minLoadedWeek !== '0000-00-00' && attendanceStore.minLoadedWeek !== '__ALL__' && statsState.startDate < attendanceStore.minLoadedWeek) {
        await ensureAttendanceRange(statsState.startDate);
      }

      renderStatsPage();
    }

    /** 平移時間軸窗口 (週數 delta: -5 為往前推移5週，+5 為往後推移5週) */
    async function shiftStatsWindow(weekDelta) {
      if (!statsState.startDate || !statsState.endDate) {
        await applyPresetRange('W10', false);
      }

      const shifted = Timeline.shift(statsState.startDate, statsState.endDate, weekDelta);
      statsState.startDate = shifted.startDate;
      statsState.endDate = shifted.endDate;

      // 若平移後超出快取，自動補抓歷史
      if (attendanceStore.minLoadedWeek && attendanceStore.minLoadedWeek !== '0000-00-00' && attendanceStore.minLoadedWeek !== '__ALL__' && statsState.startDate < attendanceStore.minLoadedWeek) {
        await ensureAttendanceRange(statsState.startDate);
      }

      // 自動同步到自訂日期輸入框
      syncDateInputs();
      renderStatsPage();
    }

    /** 重置時間軸窗口回到最新一週（預設 10 週） */
    function resetStatsWindowToLatest() {
      const sel = document.getElementById('stats-range-select');
      if (sel) sel.value = 'W10';
      applyPresetRange('W10', true);
    }

    /** 切換校園下拉選單 */
    function handleStatsCampusChange() {
      const sel = document.getElementById('stats-campus-select');
      if (sel) {
        statsState.selectedCampusId = sel.value;
        sel.blur();
      }
      renderStatsPage();
    }

    /** 下鑽特定校園 */
    function drilldownCampus(campusId) {
      statsState.selectedCampusId = campusId;
      const sel = document.getElementById('stats-campus-select');
      if (sel) sel.value = campusId;
      renderStatsPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });

    /** 切換指標顯示狀態 */
    function toggleStatsMetric(metricKey) {
      statsState.activeMetrics[metricKey] = !statsState.activeMetrics[metricKey];
      const chip = document.getElementById(`chip-metric-${metricKey}`);
      if (chip) {
        chip.classList.toggle('active', statsState.activeMetrics[metricKey]);
        if (metricKey === 'pray' || metricKey === 'outreach') {
          const prefix = statsState.activeMetrics[metricKey] ? '● ' : '＋ ';
          chip.querySelector('span').textContent = prefix + (metricKey === 'pray' ? '禱告' : '出訪');
        }
        chip.blur();
      }

      renderStatsPage();
    }

    /** 切換「排除暫停週」開關 */
    function toggleExcludeSuspendedWeeks() {
      const checkbox = document.getElementById('stats-exclude-suspended');
      if (checkbox) {
        statsState.excludeSuspended = !!checkbox.checked;
        checkbox.blur();
        renderStatsPage();
      }
    }

    /**
     * 底層核心：純粹依據 [startDate, endDate]（週日）動態推算所有相關週次
     */
    function computeTargetWeeksList() {
      if (!statsState.startDate || !statsState.endDate) {
        applyPresetRange('W10', false);
      }
      return Timeline.buildWeekList(statsState.startDate, statsState.endDate);
    }

      const chartTitle = statsState.selectedCampusId === 'ALL'

    /** 依領域報告渲染各校明細排行表格（支援點擊排序） */
    function renderStatsCampusTable(report) {
      const targetReport = report || statsState.lastReport;
      if (!targetReport || !targetReport.campusRankings) return;

      const tbody = document.getElementById('stats-campus-tbody');
      if (!tbody) return;

      const sortedRankings = StatsAggregator.sortRankings(
        targetReport.campusRankings,
        statsState.tableSort.column,
        statsState.tableSort.direction
      );

      tbody.innerHTML = sortedRankings.map(r => {
        let trendBadge = '<span class="kpi-trend-flat">― 持平</span>';
        if (r.trendStatus === 'THIS_WEEK_SUSPENDED') {
          trendBadge = '<span class="kpi-trend-suspended">本週暫停</span>';
        } else if (r.trendStatus === 'PREV_WEEK_SUSPENDED') {
          trendBadge = '<span class="kpi-trend-suspended">上週暫停</span>';
        } else if (r.trendStatus === 'UP') {
          trendBadge = `<span class="kpi-trend-up">▲ +${r.diff}</span>`;
        } else if (r.trendStatus === 'DOWN') {
          trendBadge = `<span class="kpi-trend-down">▼ ${r.diff}</span>`;
        }

        const catClass = (r.category === '高中' ? 'hs' : (r.category === '國中' ? 'jh' : (r.category === '社區排' ? 'comm' : '')));
        return `
          <tr onclick="drilldownCampus('${r.id}')" title="點擊查看 ${r.name} 的詳細走勢">
            <td>
              <div class="table-campus-cell">
                <span>${r.name}</span>
                ${r.category ? `<span class="category-badge ${catClass}">${r.category}</span>` : ''}
              </div>
            </td>
            <td style="text-align:right; font-weight:700;">${r.latestAttend} 人</td>
            <td style="text-align:right; font-weight:700; color:#0d9488;">${r.avgAttend} 人</td>
            <td style="text-align:right; color:#f97316; font-weight:600;">${r.gospelTotal} 人次</td>
            <td style="text-align:center;">${trendBadge}</td>
          </tr>
        `;
      }).join('');
    }

    /** 處理各小排統計表格點擊排序（點一下降序，再點升序） */
    function handleStatsTableSort(col) {
      if (statsState.tableSort.column === col) {
        // 同一欄位：切換方向 (desc <-> asc)
        statsState.tableSort.direction = (statsState.tableSort.direction === 'desc') ? 'asc' : 'desc';
      } else {
        // 新欄位：預設由大到小 (desc)
        statsState.tableSort.column = col;
        statsState.tableSort.direction = 'desc';
      }

      updateStatsTableSortIndicators();
      renderStatsCampusTable();
    }

    /** 更新表格標題排序箭頭指示器 (▼: 降序, ▲: 升序) */
    function updateStatsTableSortIndicators() {
      const columns = ['name', 'latestAttend', 'avgAttend', 'gospelTotal', 'trend'];
      const arrow = (statsState.tableSort.direction === 'desc') ? '▼' : '▲';

      columns.forEach(col => {
        const indEl = document.getElementById('sort-ind-' + col);
        const thEl = indEl ? indEl.closest('th') : null;
        if (indEl) {
          if (col === statsState.tableSort.column) {
            indEl.textContent = arrow;
            if (thEl) thEl.classList.add('active-sort');
          } else {
            indEl.textContent = '';
            if (thEl) thEl.classList.remove('active-sort');
          }
        }
      });
    }

    /** 計算統計數據並渲染圖表、KPI 與各校明細表 */
    function renderStatsPage() {
      // 確保校園下拉選單已填入
      const campusSelect = document.getElementById('stats-campus-select');
      if (campusSelect && campusSelect.options.length <= 1) {
        const activeCampuses = state.campuses || [];
        let html = '<option value="ALL">🌟 全體小排匯總</option>';
        activeCampuses.forEach(c => {
          html += `<option value="${c.id}">${c.name} (${c.category || '一般'})</option>`;
        });

        campusSelect.innerHTML = html;
        campusSelect.value = statsState.selectedCampusId;
      }

      // 1. 調用深模組 StatsAggregator 進行純量聚合計算
      const report = StatsAggregator.aggregate({
        attendanceByCampus: attendanceStore.attendanceByCampus || {},
        campuses: state.campuses || [],
        startDate: statsState.startDate,
        endDate: statsState.endDate,
        targetCampusId: statsState.selectedCampusId,
        excludeSuspended: statsState.excludeSuspended
      });
      statsState.lastReport = report;

      // 2. 更新時間軸區間標籤（以週日代表顯示）
      const rangeLabelEl = document.getElementById('stats-window-range-label');
      if (rangeLabelEl) {
        if (report.window.weeks.length > 0) {
          const firstW = report.window.weeks[0];
          const lastW = report.window.weeks[report.window.weeks.length - 1];
          rangeLabelEl.textContent = `${firstW.shortLabel} ～ ${lastW.shortLabel} ( 共 ${report.window.totalWeeks} 週 )`;
        } else {
          rangeLabelEl.textContent = '此區間無數據';
        }
      }

      // 3. 更新【排除暫停週】Checkbox 狀態（全體時自動隱藏並停用）
      const excludeWrap = document.getElementById('stats-exclude-suspended-wrap');
      const excludeCheckbox = document.getElementById('stats-exclude-suspended');
      if (excludeWrap && excludeCheckbox) {
        if (statsState.selectedCampusId === 'ALL') {
          excludeWrap.style.display = 'none';
          excludeCheckbox.disabled = true;
        } else {
          excludeWrap.style.display = 'inline-flex';
          excludeCheckbox.disabled = false;
          excludeCheckbox.checked = !!statsState.excludeSuspended;
        }
      }

      // 4. 更新 3 大 KPI 卡片（平均出席人數、平均福音朋友、活躍福音朋友）
      // ① 平均出席人數
      const kpiAvgAttendEl = document.getElementById('kpi-avg-attend');
      const kpiAvgAttendSubEl = document.getElementById('kpi-avg-attend-sub');
      if (kpiAvgAttendEl) kpiAvgAttendEl.textContent = `${report.kpis.attendance.formattedAvg} 人/週`;
      if (kpiAvgAttendSubEl) {
        const suspendNote = report.window.isExcludingSuspended && report.window.suspendedCount > 0
          ? ` (已扣除 ${report.window.suspendedCount} 週暫停)`
          : '';
        kpiAvgAttendSubEl.textContent = `共 ${report.window.effectiveWeeksCount} 週${suspendNote} / 累計 ${report.kpis.attendance.total} 人`;
      }

      // ② 平均福音朋友
      const kpiAvgGospelEl = document.getElementById('kpi-avg-gospel');
      const kpiAvgGospelSubEl = document.getElementById('kpi-avg-gospel-sub');
      if (kpiAvgGospelEl) kpiAvgGospelEl.textContent = `${report.kpis.gospel.formattedAvg} 人/週`;
      if (kpiAvgGospelSubEl) {
        const suspendNote = report.window.isExcludingSuspended && report.window.suspendedCount > 0
          ? ` (已扣除 ${report.window.suspendedCount} 週暫停)`
          : '';
        kpiAvgGospelSubEl.textContent = `共 ${report.window.effectiveWeeksCount} 週${suspendNote} / 累計 ${report.kpis.gospel.total} 人`;
      }

      // ③ 活躍福音朋友
      const kpiActiveGospelEl = document.getElementById('kpi-active-gospel');
      const kpiActiveGospelSubEl = document.getElementById('kpi-active-gospel-sub');
      if (kpiActiveGospelEl) kpiActiveGospelEl.textContent = `${report.kpis.activeGospel.count} 人`;
      if (kpiActiveGospelSubEl) {
        const gKpi = report.kpis.activeGospel;
        kpiActiveGospelSubEl.innerHTML = `出席 > ${gKpi.formattedThreshold}次<br>(${gKpi.totalFriends}位中有${gKpi.count}位達標)`;
      }

      // 5. 渲染 Chart.js 趨勢曲線圖
      renderStatsTrendChart(report);

      // 6. 渲染各校數據明細表
      updateStatsTableSortIndicators();
      renderStatsCampusTable(report);
    }

// ===== 人員管理同步委派 (委派至 MemberStore 前端深模組) =====

    /**
     * 取得目前人員待同步變更筆數 (委派至 MemberStore)
     * @returns {number}
     */
    function getMemberPendingCount() {
      return (typeof memberStore !== 'undefined') ? memberStore.getPendingCount() : 0;
    }

    /**
     * 排程人員變更同步 (委派至 MemberStore)
     * @param {Object} change 變更內容 ({ type: 'add'|'modify'|'delete', name, ... })
     * @param {Function} [rollbackFn] 失敗回退回調
     * @param {boolean} [immediate=false] 是否立即同步
     */
    function scheduleMemberSync(change, rollbackFn, immediate = false) {
      if (typeof memberStore !== 'undefined') {
        memberStore.scheduleMemberSync(state.currentCampusId, change, rollbackFn, immediate);
      }
    }

    /**
     * 立即將隊列中的人員變更送至後端儲存 (委派至 MemberStore)
     * @returns {Promise<void>}
     */
    function flushMemberSync() {
      if (typeof memberStore !== 'undefined') {
        return memberStore.flushMemberSync();
      }
    }

    /**
     * 合併伺服器最新人員清單與前端隊列變更 (委派至 MemberStore)
     * @param {Array} serverMembers 伺服器回傳名單
     * @param {Array} [pendingQueue] 待同步隊列
     * @param {string} [campusId] 校園 ID
     * @returns {Array} 合併後名單
     */
    function mergeServerMembersWithPendingQueue(serverMembers, pendingQueue, campusId) {
      if (typeof memberStore !== 'undefined') {
        return memberStore.mergeServerMembersWithPendingQueue(serverMembers, pendingQueue, campusId);
      }
      return serverMembers || [];
    }

    /** 返回首頁（自動落盤背景隊列） */
    function goHome() {
      if (attendanceStore.getPendingCount() > 0) attendanceStore.flush();
      if (typeof memberStore !== 'undefined' && memberStore.getPendingCount() > 0) memberStore.flush();
      doGoHome();
    }

    /** 執行實際返回首頁導覽流程 */
    function doGoHome() {
      state.currentCampusId = null;
      state.currentCampus = null;
      state.memberEditMode = false;
      state.nameChanges = [];
      state.helpPanelOpen = false;
      const helpPopup = document.getElementById('help-popup');
      const helpBtn = document.getElementById('btn-help');
      if (helpPopup) helpPopup.classList.remove('open');
      if (helpBtn) helpBtn.classList.remove('active');
      updateEditMemberBtn();
      resetFilter();

      // 重置校園編輯模式
      if (state.campusEditMode) {
        state.campusEditMode = false;
        updateCampusFooterUI();
      }

      const mainHeader = document.getElementById('main-view-header');
      if (mainHeader) mainHeader.style.display = 'block';
      document.getElementById('page-attendance').style.display = 'none';
      switchMainTab('home');
      renderCampuses();

      if (attendanceStore.hasChanged()) {
        attendanceStore.resetChanged();
      }
    }

    /** 重新整理資料（右上角 🔄 按鈕呼叫，全量同步雲端） */
    async function loadCampusDataFull() {
      if (getPendingSaveCount() > 0) {
        showToast('請等待背景儲存完成後再重新整理', 'error');
        return;
      }

      await loadInitialDataFromCloud(true);
    }

    // 身分 → CSS class 對照表
    const ROLE_CLASS_MAP = {
      '弟兄':     'role-brother',
      '姊妹':     'role-sister',
      '男界朋友': 'role-mbro',
      '女界朋友': 'role-msis',
      '服事者/家長': 'role-server'
    };

    /** 渲染人員名單（使用 DocumentFragment 批次組裝，避免 DOM 重繪） */
    function renderMembers() {
      const container = document.getElementById('member-list');

      // 依關鍵字（優先，忽略空白）或身分篩選
      const q = state.searchQuery || '';
      const filtered = q !== ''
        ? state.members.filter(m => (m.name || '').replace(/\s+/g, '').includes(q))
        : (state.roleFilter === '全部'
            ? state.members
            : state.members.filter(m => m.role === state.roleFilter));
      if (state.members.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="icon">👥</div>
            <p>尚無人員，點擊右下角編輯後新增</p>
          </div>`;
        return;
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="icon">🔍</div>
            <p></p>
          </div>`;
        container.querySelector('p').textContent = q !== ''
          ? `找不到符合「${q}」的人員`
          : `目前篩選「${state.roleFilter}」無人員`;
        return;
      }

      const fragment = document.createDocumentFragment();
      filtered.forEach(member => {
        const isPresent = state.memberEditMode
          ? (member.defaults || []).includes('出席')
          : attendanceStore.isMarked(member.name, '出席');
        const isPraying = state.memberEditMode
          ? (member.defaults || []).includes('禱告')
          : attendanceStore.isMarked(member.name, '禱告');
        const isGospel  = state.memberEditMode
          ? (member.defaults || []).includes('傳福音')
          : attendanceStore.isMarked(member.name, '傳福音');
        const roleClass = ROLE_CLASS_MAP[member.role] || '';
        const card = document.createElement('div');
        card.className = 'member-card'
          + (roleClass ? ' ' + roleClass : '')
          + (isPresent ? ' present' : '')
          + (state.memberEditMode ? ' edit-mode' : '');
        card.dataset.name = member.name;

        // 姓名
        const nameEl = document.createElement('div');
        nameEl.className = 'member-name';
        nameEl.textContent = member.name;
        card.appendChild(nameEl);

        // 標籤資訊（社區排顯示於姓名下方：[原屬校園 · 學段]；校園排中若學段不同於該校則顯示於卡片右上角）
        const currentCampus = state.campuses.find(c => c.id === state.currentCampusId) ||
                              (state.archivedCampuses && state.archivedCampuses.find(c => c.id === state.currentCampusId));
        const isComm = CampusDomain.isCommunity(currentCampus);

        if (isComm) {
          let campusName = '';
          if (member.otherGroupId) {
            const linkedCampus = state.campuses.find(c => c.id === member.otherGroupId) ||
                                 (state.archivedCampuses && state.archivedCampuses.find(c => c.id === member.otherGroupId));
            if (linkedCampus) campusName = linkedCampus.name;
          }
          let metaText = '';
          if (campusName) {
            metaText = `${campusName} · ${member.stage || '高中'}`;
          } else if (member.stage) {
            metaText = member.stage;
          }
          if (metaText) {
            const metaEl = document.createElement('div');
            metaEl.className = 'member-meta-tag';
            metaEl.textContent = metaText;
            card.appendChild(metaEl);
          }
        } else {
          // 校園排：若學段與該校分類不同，顯示在成員卡片右上角（如高中排內的國中生）
          if (member.stage && currentCampus && currentCampus.category && member.stage !== currentCampus.category) {
            const stageBadge = document.createElement('span');
            const stageClass = member.stage === '高中' ? ' hs' : '';
            stageBadge.className = 'member-stage-badge' + stageClass;
            stageBadge.textContent = member.stage;
            card.appendChild(stageBadge);
          }
        }
        if (state.memberEditMode) {
          // 編輯按鈕（左上）
          const editBadge = document.createElement('span');
          editBadge.className = 'edit-badge';
          editBadge.textContent = '✏️';
          editBadge.title = '修改姓名/身分';
          card.appendChild(editBadge);

          // 刪除按鈕（右上）
          const deleteBadge = document.createElement('span');
          deleteBadge.className = 'delete-badge';
          deleteBadge.textContent = '✕';
          deleteBadge.title = '刪除人員';
          card.appendChild(deleteBadge);
        }

        // 三個動作按鈕（正常模式點名 / 編輯模式設定預設參與）
        const actionsEl = document.createElement('div');
        actionsEl.className = 'member-actions';
        const btnDefs = [
          { cls: 'attend', type: '出席',   label: '出席', on: isPresent },
          { cls: 'pray',   type: '禱告',   label: '禱告', on: isPraying },
          { cls: 'gospel', type: '傳福音', label: '出訪', on: isGospel  },
        ];
        btnDefs.forEach(def => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'action-btn ' + def.cls + (def.on ? ' on' : '');
          btn.title = state.memberEditMode ? `設定預設「${def.label}」` : def.label;
          btn.dataset.type = def.type;
          btn.textContent = def.label;
          actionsEl.appendChild(btn);
        });

        card.appendChild(actionsEl);
        fragment.appendChild(card);
      });

      if (container.replaceChildren) {
        container.replaceChildren(fragment);
      } else {
        container.innerHTML = '';
        container.appendChild(fragment);
      }
    }

    /** 局部更新單一成員卡片的狀態，無需重新渲染整張列表 (0 毫秒極速 DOM 局部重繪) */
    function updateMemberCard(name) {
      const card = document.querySelector(`#member-list .member-card[data-name="${CSS.escape(name)}"]`);
      if (!card) return;
      const isPresent = attendanceStore.isMarked(name, '出席');
      const isPraying = attendanceStore.isMarked(name, '禱告');
      const isGospel  = attendanceStore.isMarked(name, '傳福音');
      card.classList.toggle('present', isPresent);
      const attendBtn = card.querySelector('.action-btn.attend');
      if (attendBtn) attendBtn.classList.toggle('on', isPresent);
      const prayBtn = card.querySelector('.action-btn.pray');
      if (prayBtn) prayBtn.classList.toggle('on', isPraying);
      const gospelBtn = card.querySelector('.action-btn.gospel');
      if (gospelBtn) gospelBtn.classList.toggle('on', isGospel);
    }

    // ===== 點名操作與週次切換（由 AttendanceStore 驅動） =====

    /** 點擊切換出席/禱告/傳福音 (0ms 樂觀更新 + 防抖聚合，由 AttendanceStore 驅動) */
    function toggleRecord(name, type) {
      if (isCurrentWeekSuspended()) return;
      const member = state.members.find(m => m.name === name);
      const res = attendanceStore.toggle(name, type, member ? member.role : '');
      if (type === '出席' && member && res) {
        if (res.isMarked) {
          member.count = (member.count || 0) + 1;
        } else {
          member.count = Math.max(0, (member.count || 0) - 1);
        }
      }
      updateMemberCard(name);
      updateAttendanceCount();
    }

    async function changeWeek(delta) {
      if (attendanceStore.getPendingCount() > 0) attendanceStore.flush();
      state.weekOffset += delta;
      document.getElementById('week-label').innerHTML = getWeekLabel();

      await attendanceStore.setWeek(getCurrentWeekStr());

    /** 新增人位（0ms 樂觀更新 + 防抖背景同步，由 MemberStore 驅動） */
    function handleAddMember() {
      const name = document.getElementById('input-member-name').value.trim();
      if (!name) { showToast('請輸入姓名', 'error'); return; }

      // 檢查同校是否重名
      if (state.members.some(m => m.name === name)) {
        showToast('此小排已存在相同姓名的人員', 'error');
        return;
      }

      const selectedRoleBtn = document.querySelector('#role-selector .role-btn.selected');
      if (!selectedRoleBtn) { showToast('請選擇身分', 'error'); return; }
      const role = selectedRoleBtn.dataset.role;
      const defaults = getSelectedDefaults('add-defaults-selector');

      const currentCampus = state.campuses.find(c => c.id === state.currentCampusId) ||
                            (state.archivedCampuses && state.archivedCampuses.find(c => c.id === state.currentCampusId));
      const isComm = CampusDomain.isCommunity(currentCampus);

      let otherGroupId = '';
      if (isComm) {
        const otherGroupIdEl = document.getElementById('add-member-other-campus');
        otherGroupId = otherGroupIdEl ? otherGroupIdEl.value.trim() : '';
      }
      const stage = getSelectedStage('add');

      const newMember = {
        name: name,
        count: 0,
        role: role,
        defaults: defaults,
        otherGroupId: otherGroupId,
        stage: stage || '其他'
      };
      state.members.push(newMember);
      sortMemberList(state.members);

      if (state.currentCampusId) {
        state.membersByCampus[state.currentCampusId] = state.members;
      }

      closeModal('modal-add-member');
      renderMembers();

      const change = {
        type: 'add',
        name: name,
        role: role,
        stage: stage || '其他',
        defaults: defaults,
        otherGroupId: otherGroupId
      };
      const rollbackFn = () => {
        const idx = state.members.findIndex(m => m.name === name);
        if (idx !== -1) state.members.splice(idx, 1);
        if (state.currentCampusId) {
          state.membersByCampus[state.currentCampusId] = state.members;
        }
        if (typeof renderMembers === 'function') renderMembers();
      };
      scheduleMemberSync(change, rollbackFn);
      showToast(`已新增「${name}」`, 'success');
    }

    /** 刪除人位（0ms 樂觀更新 + 防抖背景同步，由 MemberStore 驅動） */
    function handleDeleteMember(name) {
      const idx = state.members.findIndex(m => m.name === name);
      if (idx === -1) return;
      const deletedMember = state.members.splice(idx, 1)[0];
      attendanceStore.removeMember(name);
      if (state.currentCampusId) {
        state.membersByCampus[state.currentCampusId] = state.members;
      }

      renderMembers();

      const change = { type: 'delete', name: name };
      const rollbackFn = () => {
        state.members.push(deletedMember);
        sortMemberList(state.members);
        if (state.currentCampusId) {
          state.membersByCampus[state.currentCampusId] = state.members;
        }
        if (typeof renderMembers === 'function') renderMembers();
      };
      scheduleMemberSync(change, rollbackFn);
      showToast(`已刪除「${name}」`, 'success');
    }

    /** 儲存人位編輯（0ms 樂觀更新 + 防抖背景同步，由 MemberStore 驅動） */
    function handleEditMember() {
      const oldName = document.getElementById('edit-member-oldname').value;
      const newName = document.getElementById('edit-member-name').value.trim();
      if (!newName) { showToast('請輸入姓名', 'error'); return; }

      // 若改名，檢查新名稱是否重複
      if (newName !== oldName && state.members.some(m => m.name === newName)) {
        showToast('此小排已存在相同姓名的人員', 'error');
        return;
      }

      const selectedRoleBtn = document.querySelector('#edit-role-selector .role-btn.selected');
      if (!selectedRoleBtn) { showToast('請選擇身分', 'error'); return; }
      const newRole = selectedRoleBtn.dataset.role;
      const member = state.members.find(m => m.name === oldName);
      if (!member) {
        closeModal('modal-edit-member');
        return;
      }
      const oldRole = member.role;

      // 檢查是否發生實質變更（若無變更，避免無意義的儲存與網路請求）
      const currentCampus = state.campuses.find(c => c.id === state.currentCampusId) ||
                            (state.archivedCampuses && state.archivedCampuses.find(c => c.id === state.currentCampusId));
      const isComm = CampusDomain.isCommunity(currentCampus);

      const defaults = getSelectedDefaults('edit-defaults-selector');
      const stage = getSelectedStage('edit');

      let targetOtherGroupId = member.otherGroupId || '';
      if (isComm) {
        const otherGroupIdEl = document.getElementById('edit-member-other-campus');
        targetOtherGroupId = otherGroupIdEl ? otherGroupIdEl.value.trim() : '';
      } else {
        const isRenamed = (newName !== oldName);
        const isStageChanged = (stage && member.stage && member.stage !== stage);
        if (isRenamed || isStageChanged) {
          targetOtherGroupId = '';
        }
      }

      const oldDefaults = Array.isArray(member.defaults) ? member.defaults : [];
      const isDefaultsEqual = (oldDefaults.length === defaults.length) &&
        defaults.every(d => oldDefaults.includes(d));

      const hasChanged = (newName !== oldName) ||
                         (newRole !== oldRole) ||
                         ((stage || '其他') !== (member.stage || '其他')) ||
                         !isDefaultsEqual ||
                         (targetOtherGroupId !== (member.otherGroupId || ''));

      if (!hasChanged) {
        // 未發生任何變更：直接關閉彈窗，避免無意義儲存
        closeModal('modal-edit-member');
        return;
      }

      // 檢查非標準身分轉換 (降級或性別轉換)
      const isDowngrade = ['弟兄', '姊妹', '服事者/家長'].includes(oldRole) && ['男界朋友', '女界朋友'].includes(newRole);
      const isGenderChange = (['男界朋友', '弟兄'].includes(oldRole) && ['女界朋友', '姊妹'].includes(newRole)) ||
                             (['女界朋友', '姊妹'].includes(oldRole) && ['男界朋友', '弟兄'].includes(newRole));
      if (oldRole && oldRole !== newRole && (isDowngrade || isGenderChange)) {
        let reason = '';
        if (isDowngrade) reason = '受浸身分通常不可逆（弟兄/姊妹 ➔ 朋友）';
        if (isGenderChange) reason = '性別通常不應轉換';
        confirmAction(
          '⚠️ 身分變更警告',
          `您正將成員身分從「<b>${oldRole}</b>」變更為「<b>${newRole}</b>」<br><small style="color:var(--gray-500)">(${reason})</small><br><br>確定要繼續修改嗎？`,
          '確定修改',
          () => executeSaveMemberEdit(oldName, newName, newRole, defaults, stage, targetOtherGroupId)
        );
        return;
      }

      executeSaveMemberEdit(oldName, newName, newRole, defaults, stage, targetOtherGroupId);
    }

    /**
     * 執行人員編輯儲存與同步排程（樂觀更新卡片、連動改名與註冊回退）
     * @param {string} oldName 原姓名
     * @param {string} newName 新姓名
     * @param {string} newRole 新身分
     * @param {Array<string>} [preDefaults] 預設參與清單
     * @param {string} [preStage] 學段
     * @param {string} [preOtherGroupId] 關聯小排 ID
     */
    function executeSaveMemberEdit(oldName, newName, newRole, preDefaults, preStage, preOtherGroupId) {
      const currentCampus = state.campuses.find(c => c.id === state.currentCampusId) ||
                            (state.archivedCampuses && state.archivedCampuses.find(c => c.id === state.currentCampusId));
      const isComm = CampusDomain.isCommunity(currentCampus);

      const defaults = preDefaults !== undefined ? preDefaults : getSelectedDefaults('edit-defaults-selector');
      const stage = preStage !== undefined ? preStage : getSelectedStage('edit');

      const member = state.members.find(m => m.name === oldName);
      const oldMemberSnapshot = member ? {
        name: oldName,
        role: member.role,
        stage: member.stage,
        defaults: [...(member.defaults || [])],
        otherGroupId: member.otherGroupId
      } : null;

      if (member) {
        let otherGroupId = preOtherGroupId !== undefined ? preOtherGroupId : (member.otherGroupId || '');
        if (preOtherGroupId === undefined) {
          if (isComm) {
            const otherGroupIdEl = document.getElementById('edit-member-other-campus');
            otherGroupId = otherGroupIdEl ? otherGroupIdEl.value.trim() : '';
          } else {
            // 校園排：若改名或改學段，本地主動清空連結標籤 (Case 2)
            const isRenamed = (newName !== oldName);
            const isStageChanged = (stage && member.stage && member.stage !== stage);
            if (isRenamed || isStageChanged) {
              otherGroupId = '';
            }
          }
        }

        member.name = newName;
        member.role = newRole;
        member.defaults = defaults;
        member.otherGroupId = otherGroupId;
        if (stage) member.stage = stage;
      }

      if (newName !== oldName) {
        attendanceStore.renameMember(oldName, newName);
        sortMemberList(state.members);
      }

      if (state.currentCampusId) {
        state.membersByCampus[state.currentCampusId] = state.members;
      }

      closeModal('modal-edit-member');
      renderMembers();

      const change = {
        type: 'modify',
        oldName: oldName,
        name: newName,
        role: newRole,
        stage: stage || '',
        defaults: defaults,
        otherGroupId: member ? member.otherGroupId : ''
      };
      const rollbackFn = () => {
        if (oldMemberSnapshot) {
          const target = state.members.find(m => m.name === newName);
          if (target) {
            target.name = oldMemberSnapshot.name;
            target.role = oldMemberSnapshot.role;
            target.stage = oldMemberSnapshot.stage;
            target.defaults = oldMemberSnapshot.defaults;
            target.otherGroupId = oldMemberSnapshot.otherGroupId;
          }
          if (newName !== oldName) {
            attendanceStore.renameMember(newName, oldName);
            sortMemberList(state.members);
          }
          if (state.currentCampusId) {
            state.membersByCampus[state.currentCampusId] = state.members;
          }
          if (typeof renderMembers === 'function') renderMembers();
        }
      };
      scheduleMemberSync(change, rollbackFn);
      showToast(`已修改「${newName}」`, 'success');
    }

    /** 從編輯 modal 觸發刪除（先關 modal，再走確認流程） */
    function handleDeleteFromEdit() {

    /** 在編輯模式下本地切換成員的預設參與值（0ms 即時反饋） */
    function toggleMemberDefaultLocal(member, type) {
      if (!Array.isArray(member.defaults)) member.defaults = [];
      const idx = member.defaults.indexOf(type);
      const wasPresent = (idx !== -1);
      if (idx !== -1) {
        member.defaults.splice(idx, 1);
      } else {
        member.defaults.push(type);
      }

      if (state.currentCampusId) {
        state.membersByCampus[state.currentCampusId] = state.members;
      }

      const defaultChange = {
        type: 'modify',
        oldName: member.name,
        name: member.name,
        role: member.role,
        stage: member.stage || '',
        defaults: [...member.defaults],
        otherGroupId: member.otherGroupId || ''
      };
      const rollbackDefaultFn = () => {
        const target = state.members.find(m => m.name === member.name);
        if (target) {
          if (wasPresent) {
            if (!target.defaults.includes(type)) target.defaults.push(type);
          } else {
            const i = target.defaults.indexOf(type);
            if (i !== -1) target.defaults.splice(i, 1);
          }
          if (state.currentCampusId) {
            state.membersByCampus[state.currentCampusId] = state.members;
          }
        }
      };
      scheduleMemberSync(defaultChange, rollbackDefaultFn);

      // 局部更新該卡片上的按鈕狀態與卡片背景亮起狀態
      const card = document.querySelector(`#member-list .member-card[data-name="${CSS.escape(member.name)}"]`);
      if (card) {
        const isPresent = member.defaults.includes('出席');
        card.classList.toggle('present', isPresent);
        const btn = card.querySelector(`.action-btn[data-type="${type}"]`);
        if (btn) {
          btn.classList.toggle('on', member.defaults.includes(type));
        }
      }
    }

    /** 點擊「⚡ 套用預設」按鈕 */
    function handleApplyDefaultsClick() {
      if (isCurrentWeekSuspended()) {
        showToast('本週小排已暫停，無法套用預設名單', 'error');
        return;
      }

      if (getPendingSaveCount() > 0) {
        showToast('請等待背景儲存完成後再套用預設', 'error');
        return;
      }

      // 檢查當前週次是否已有點名紀錄
      const counts = attendanceStore.getWeekCounts();
      const hasRecords = counts.attend > 0 || counts.pray > 0 || counts.gospel > 0;
      if (!hasRecords) {
        // 當週全空，直接套用
        applyDefaultsConfirmed();
      } else {
        // 當週已有紀錄，提示覆蓋確認
        confirmAction(
          '確認覆蓋點名紀錄',
          '本週已有部分點名紀錄，確定要<span class="confirm-highlight">覆蓋現有紀錄</span>並套用預設參與名單嗎？<br><small style="color:var(--gray-500)">現有紀錄將被預設名單取代。</small>',
          '覆蓋套用',
          applyDefaultsConfirmed
        );
      }
    }

    /** 執行套用預設參與名單 */
    async function applyDefaultsConfirmed() {
      const weekStr = getCurrentWeekStr();
      const campusId = state.currentCampusId;

      // 整理要套用的新紀錄清單
      const newRecords = [];
      state.members.forEach(member => {
        if (Array.isArray(member.defaults)) {
          member.defaults.forEach(type => {
            if (['出席', '禱告', '傳福音'].includes(type)) {
              newRecords.push({ name: member.name, type: type, role: member.role || '' });
            }
          });
        }
      });

      // ① 立即樂觀更新前端快取與 UI (0ms 即時反饋)
      const savePromise = attendanceStore.applyDefaults(newRecords);
      renderMembers();
      updateAttendanceCount();
      showToast('已套用預設名單', 'success');

      // ② 背景等待後端批次寫回
      showLoading();
      try {
        await savePromise;
      } catch (e) {
        showToast('套用失敗：' + e.message, 'error');
        await loadCampusDataFull();
      } finally {
        hideLoading();
      }
    }

      if (searchInput) searchInput.value = '';
      handleFilterSearchInput('');
      if (state.filterPanelOpen) {
        if (searchInput) searchInput.focus();
      } else {
        closeFilterPanel();
      }
    }

    /** 切換說明面板開關 */
    function toggleHelpPanel() {
      state.helpPanelOpen = !state.helpPanelOpen;
      updateHelpContent();
      const helpPopup = document.getElementById('help-popup');
      const helpBtn = document.getElementById('btn-help');
      if (helpPopup) helpPopup.classList.toggle('open', state.helpPanelOpen);
      if (helpBtn) {
        helpBtn.classList.toggle('active', state.helpPanelOpen);
        if (!state.helpPanelOpen) helpBtn.blur();
      }

      // 若打開說明，自動收合篩選面板
      if (state.helpPanelOpen && state.filterPanelOpen) {
        closeFilterPanel();
      }
    }

    /** 設定身分篩選（自動清空搜尋框並切換至指定身分） */
    function setRoleFilter(role, chipEl) {
      state.roleFilter = role;
      state.searchQuery = '';

      const searchInput = document.getElementById('filter-search-input');
      const clearBtn = document.getElementById('filter-search-clear');
      if (searchInput) searchInput.value = '';
      if (clearBtn) clearBtn.style.display = 'none';

      // 更新 chip 選中狀態
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('selected'));
      chipEl.classList.add('selected');

      // 篩選按鈕顯示狀態
      const toggleBtn = document.getElementById('filter-toggle-btn');
      if (role === '全部') {
        toggleBtn.textContent = '🔍 篩選';
        toggleBtn.classList.remove('active-filter');
      } else {
        toggleBtn.textContent = `🔍 ${role}`;
        toggleBtn.classList.add('active-filter');
      }

      // 關閉面板並重新渲染
      closeFilterPanel();
      renderMembers();
    }

    /** 進入校園或返回首頁時重置篩選、搜尋與說明狀態 */
    function resetFilter() {
      state.roleFilter = '全部';
      state.searchQuery = '';
      state.filterPanelOpen = false;
      state.helpPanelOpen = false;
      const searchInput = document.getElementById('filter-search-input');
      const clearBtn = document.getElementById('filter-search-clear');
      if (searchInput) searchInput.value = '';
      if (clearBtn) clearBtn.style.display = 'none';
      const helpPopup = document.getElementById('help-popup');
      const helpBtn = document.getElementById('btn-help');
      if (helpPopup) helpPopup.classList.remove('open');
      if (helpBtn) helpBtn.classList.remove('active');
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('selected'));
      const allChip = document.querySelector('.filter-chip[data-role="全部"]');
      if (allChip) allChip.classList.add('selected');
      const toggleBtn = document.getElementById('filter-toggle-btn');
      if (toggleBtn) {
        toggleBtn.textContent = '🔍 篩選';
        toggleBtn.classList.remove('active-filter');
      }
      closeFilterPanel();
    }

    // ===== Member List 事件委派 =====
    /**
     * 初始化人員名單點擊事件委派（單一事件監聽器處理點名打卡、編輯成員與預設值切換）
     */
    function initMemberListDelegation() {
      const container = document.getElementById('member-list');
      if (!container) return;
      container.addEventListener('click', (e) => {
        const card = e.target.closest('.member-card');
        if (!card) return;
        const name = card.dataset.name;
        if (!name) return;
        if (state.memberEditMode) {
          const member = state.members.find(m => m.name === name);
          if (!member) return;
          const deleteBadge = e.target.closest('.delete-badge');
          if (deleteBadge) {
            confirmDelete('人位', name, () => handleDeleteMember(name));
            return;
          }

          const actionBtn = e.target.closest('.action-btn');
          if (actionBtn) {
            const type = actionBtn.dataset.type;
            if (type) {
              toggleMemberDefaultLocal(member, type);
            }

            return;
          }

          // 點擊 edit-badge 或卡片本體開啟編輯 modal（修改姓名與身分）
          openEditMemberModal(member);
        } else {
          const actionBtn = e.target.closest('.action-btn');
          if (actionBtn) {
            const type = actionBtn.dataset.type;
            if (type) {
              toggleRecord(name, type);
            }
          }
        }
      });
    }

    // ===== 篩選與說明面板點擊外部關閉（使用捕獲階段以確保任何區域點擊皆能觸發） =====
    document.addEventListener('click', (e) => {
      if (state.filterPanelOpen) {
        const filterBar = document.getElementById('filter-bar');
        if (filterBar && !filterBar.contains(e.target)) {
          closeFilterPanel();
        }
      }

      if (state.helpPanelOpen) {
        const fabGroup = document.getElementById('fab-group');
        if (fabGroup && !fabGroup.contains(e.target)) {
          state.helpPanelOpen = false;
          const helpPopup = document.getElementById('help-popup');
          const helpBtn = document.getElementById('btn-help');
          if (helpPopup) helpPopup.classList.remove('open');
          if (helpBtn) helpBtn.classList.remove('active');
        }
      }

    }, true);

    // ===== Modal 鍵盤支持 =====
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('modal-add-campus').classList.contains('active')) {
          handleAddCampus();
        } else if (document.getElementById('modal-add-member').classList.contains('active')) {
          handleAddMember();
        } else if (document.getElementById('modal-edit-member').classList.contains('active')) {
          handleEditMember();
        } else if (document.getElementById('modal-rename-campus').classList.contains('active')) {
          handleRenameCampus();
        } else if (document.getElementById('modal-confirm').classList.contains('active')) {
          handleConfirm();
        }
      }

      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-backdrop.active').forEach(m => {
          closeModal(m.id);
        });
      }
    });

    // 點擊 modal 背景關閉
    // 重要防護：表單類對話框（新增小排、編輯小排、新增成員、編輯成員、刪除確認等）
    // 禁止點擊背景空白關閉，必須點擊「取消」或對應按鈕，徹底杜絕誤觸與手機端偏移引發的悲劇！
    const noBackdropCloseModals = new Set([
      'modal-add-campus',
      'modal-rename-campus',
      'modal-add-member',
      'modal-edit-member',
      'modal-confirm'
    ]);

    document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
      let downTarget = null;
      backdrop.addEventListener('pointerdown', (e) => {
        downTarget = e.target;
      });
      backdrop.addEventListener('pointercancel', () => {
        downTarget = null;
      });

      // 關鍵防護：當手指在背景遮罩（對話框外部）滑動時，完全阻止滾動手勢傳遞，徹底凍結背景畫面！
      backdrop.addEventListener('touchmove', (e) => {
        if (e.target === backdrop) {
          e.preventDefault();
        }
      }, { passive: false });

      backdrop.addEventListener('click', (e) => {
        if (noBackdropCloseModals.has(backdrop.id)) {
          downTarget = null;
          return;
        }
        if (e.target === backdrop && downTarget === backdrop) {
          closeModal(backdrop.id);
        }
        downTarget = null;
      });
    });

    // ===== 初始化 =====
    window.addEventListener('DOMContentLoaded', () => {
      initCampusListDelegation();
      initMemberListDelegation();
      if (typeof SERVER_PRELOADED_DATA !== 'undefined' && SERVER_PRELOADED_DATA && SERVER_PRELOADED_DATA.campuses) {
        // 伺服器端已預載：0 毫秒立即呈現首頁！
        applyLoadedData(SERVER_PRELOADED_DATA);
      } else {
        // 備援：單次拉取雲端全域資料
        loadInitialDataFromCloud(false);
      }
    });
</script>
