<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// ==========================================
    // ===== AttendanceStore 前端深模組 =====
    // ==========================================

    /**
     * 點名狀態管理與批次同步深模組 (AttendanceStore)
     * 封裝：0ms 樂觀更新、當週 Set 索引、防抖聚合隊列、意圖保留 (保護連續點擊不被覆蓋)、
     * 指數退避探測參數 rPrime 計算、歷史點名滑動載入與頭部拼接。
     */
    class AttendanceStore {
      /**
       * @param {Object} [options]
       * @param {Object} [options.apiClient] API Client 物件（提供 batchUpdateAttendance, applyDefaultAttendance, getAttendanceHistory）
       * @param {Function} [options.onSyncStatusChange] 同步狀態計數變更通知 (pendingCount) => void
       * @param {Function} [options.onToast] 訊息提示通知 (message, type) => void
       * @param {number} [options.debounceMs=400] 防抖延遲時間（毫秒）
       * @param {number} [options.maxRetries=3] 網路錯誤重試次數
       */
      constructor(options = {}) {
        this.apiClient = options.apiClient || {};
        this.onSyncStatusChange = options.onSyncStatusChange || (() => {});
        this.onToast = options.onToast || (() => {});
        this.debounceMs = options.debounceMs ?? 400;
        this.maxRetries = options.maxRetries ?? 3;

        this.attendanceByCampus = {}; // { [campusId]: [{name, week, type, role}] }
        this.minLoadedWeek = '';
        this.currentCampusId = null;
        this.currentWeekStr = '';
        this.weekIndex = { '出席': new Set(), '禱告': new Set(), '傳福音': new Set() };
        this.syncQueue = {};
        this.batchSyncTimer = null;
        this.isBatchSyncInFlight = false;
        this.attendanceChanged = false;
        this.isLoadingHistory = false;
      }

      /**
       * 載入雲端初始點名資料與最小載入週次
       * @param {Object.<string, Array>} attendanceByCampus 各校點名紀錄集合
       * @param {string} minLoadedWeek 目前已加載的最小週次字串 (YYYY-MM-DD)
       */
      loadInitialData(attendanceByCampus, minLoadedWeek) {
        this.attendanceByCampus = attendanceByCampus || {};
        this.minLoadedWeek = minLoadedWeek || '';
        if (this.currentCampusId && this.currentWeekStr) this._rebuildWeekIndex();
      }

      /**
       * 設定當前檢視的校園與週次上下文，並自動重建索引
       * @param {string} campusId 校園 ID
       * @param {string} weekStr 週一日期字串 (YYYY-MM-DD)
       */
      setCurrentContext(campusId, weekStr) {
        this.currentCampusId = campusId;
        this.currentWeekStr = weekStr;
        this._rebuildWeekIndex();
      }

      /**
       * 內部重構當前週次的 O(1) 點名快速檢索 Set 索引
       * @private
       */
      _rebuildWeekIndex() {
        this.weekIndex = { '出席': new Set(), '禱告': new Set(), '傳福音': new Set() };
        if (!this.currentCampusId || !this.currentWeekStr) return;
        const list = this.attendanceByCampus[this.currentCampusId] || [];
        for (let i = 0; i < list.length; i++) {
          const r = list[i];
          if (r.week === this.currentWeekStr && this.weekIndex[r.type]) {
            this.weekIndex[r.type].add(r.name);
          }
        }
      }

      /**
       * 檢查特定成員在當前週次中是否已勾選特定點名類型
       * @param {string} name 成員姓名
       * @param {string} type 點名類型 ('出席' | '禱告' | '傳福音')
       * @returns {boolean}
       */
      isMarked(name, type) {
        return Boolean(this.weekIndex[type]?.has(name));
      }

      /**
       * 取得當前週次各項點名之統計計數
       * @returns {{ attend: number, pray: number, gospel: number }}
       */
      getWeekCounts() {
        return {
          attend: this.weekIndex['出席']?.size || 0,
          pray:   this.weekIndex['禱告']?.size || 0,
          gospel: this.weekIndex['傳福音']?.size || 0
        };
      }

      /**
       * 計算目前等待同步至後端的點名操作筆數
       * @returns {number}
       */
      getPendingCount() {
        let count = 0;
        for (const k in this.syncQueue) {
          if (this.syncQueue[k].desiredState !== this.syncQueue[k].syncedState) count++;
        }
        return count;
      }

      /**
       * 檢查本次會話中點名資料是否有發生實質變更
       * @returns {boolean}
       */
      hasChanged() { return this.attendanceChanged; }

      /**
       * 重置變更標記
       */
      resetChanged() { this.attendanceChanged = false; }

      /**
       * 取得特定校園在快取中的全部點名紀錄陣列
       * @param {string} [campusId] 校園 ID（未提供則使用當前校園）
       * @returns {Array}
       */
      getCurrentCampusAttendance(campusId) {
        const cid = campusId || this.currentCampusId;
        if (!cid) return [];
        return (this.attendanceByCampus[cid] ||= []);
      }

      /**
       * 依週次排序將紀錄插入至指定校園的點名陣列中
       * @private
       * @param {Array} list 點名紀錄清單
       * @param {Object} record 點名紀錄物件
       */
      _insertAttendanceSorted(list, record) {
        let i = list.length;
        while (i > 0 && list[i - 1].week > record.week) i--;
        if (i === list.length) list.push(record);
        else list.splice(i, 0, record);
      }

      /**
       * 精準計算大於等於目標週次（targetWeek）之所有校園點名紀錄總筆數 (rPrime)
       * 供後端指數退避定位探測使用
       * @param {string} targetWeek 目標週一日期 (YYYY-MM-DD)
       * @returns {number}
       */
      computeTargetWeekRPrime(targetWeek) {
        if (this.minLoadedWeek && this.minLoadedWeek !== '0000-00-00' && this.minLoadedWeek !== '__ALL__' && targetWeek < this.minLoadedWeek) {
          return 0;
        }
        let count = 0;
        for (const cid in this.attendanceByCampus) {
          const list = this.attendanceByCampus[cid] || [];
          for (let i = list.length - 1; i >= 0; i--) {
            if (list[i].week >= targetWeek) count++;
            else break;
          }
        }
        return count;
      }

      /**
       * 點擊切換出席/禱告/傳福音狀態 (0ms 樂觀更新 + 防抖聚合隊列)
       * @param {string} name 成員姓名
       * @param {string} type 點名類型 ('出席' | '禱告' | '傳福音')
       * @param {string} [role=''] 當時身分（弟兄/姊妹/男界朋友/女界朋友）
       * @returns {{ isMarked: boolean, weekCounts: { attend: number, pray: number, gospel: number } }}
       */
      toggle(name, type, role = '') {
        const campus = this.currentCampusId, weekStr = this.currentWeekStr;
        if (!campus || !weekStr) throw new Error('未設定當前校園或週次上下文');

        const key = `${campus}|${name}|${weekStr}|${type}`;
        const list = this.getCurrentCampusAttendance(campus);

        if (!this.syncQueue[key]) {
          const currentIsOn = this.isMarked(name, type);
          this.syncQueue[key] = {
            campus, name, role: role || '', weekStr, type,
            syncedState: currentIsOn, desiredState: currentIsOn
          };
        }

        const entry = this.syncQueue[key];
        entry.desiredState = !entry.desiredState;

        if (entry.desiredState) {
          this.weekIndex[type]?.add(name);
          if (!list.some(r => r.name === name && r.week === weekStr && r.type === type)) {
            this._insertAttendanceSorted(list, { name, week: weekStr, type, role: entry.role || role });
          }
        } else {
          this.weekIndex[type]?.delete(name);
          const idx = list.findIndex(r => r.name === name && r.week === weekStr && r.type === type);
          if (idx !== -1) list.splice(idx, 1);
        }

        this.attendanceChanged = true;
        if (entry.desiredState === entry.syncedState && !this.isBatchSyncInFlight) {
          delete this.syncQueue[key];
        }

        this.onSyncStatusChange(this.getPendingCount());
        this.scheduleBatchSync();

        return { isMarked: entry.desiredState, weekCounts: this.getWeekCounts() };
      }

      /**
       * 排程防抖批次同步計時器
       * @param {boolean} [immediate=false] 是否略過防抖立即送出
       */
      scheduleBatchSync(immediate = false) {
        if (this.batchSyncTimer) {
          clearTimeout(this.batchSyncTimer);
          this.batchSyncTimer = null;
        }
        if (immediate) {
          this.flush();
          return;
        }
        this.batchSyncTimer = setTimeout(() => {
          this.batchSyncTimer = null;
          this.flush();
        }, this.debounceMs);
        this.onSyncStatusChange(this.getPendingCount());
      }

      /**
       * 立即將隊列中所有待同步的點名變更批次送至後端
       * 支援意圖保護 (若在途請求返回前使用者已再次切換，不被舊失敗還原覆蓋)
       * @returns {Promise<void>}
       */
      async flush() {
        if (this.isBatchSyncInFlight) return;
        if (this.batchSyncTimer) {
          clearTimeout(this.batchSyncTimer);
          this.batchSyncTimer = null;
        }

        const pendingKeys = Object.keys(this.syncQueue).filter(
          k => this.syncQueue[k].desiredState !== this.syncQueue[k].syncedState
        );
        if (pendingKeys.length === 0) {
          this.onSyncStatusChange(0);
          return;
        }

        const campusId = this.syncQueue[pendingKeys[0]].campus;
        const weekStr  = this.syncQueue[pendingKeys[0]].weekStr;
        const marks = [], unmarks = [], batchEntries = [];

        pendingKeys.forEach(k => {
          const item = this.syncQueue[k];
          if (item.campus !== campusId || item.weekStr !== weekStr) return;
          batchEntries.push({ key: k, targetState: item.desiredState, item });
          if (item.desiredState) marks.push({ name: item.name, role: item.role || '', type: item.type });
          else unmarks.push({ name: item.name, type: item.type });
        });

        this.isBatchSyncInFlight = true;
        this.onSyncStatusChange(this.getPendingCount());

        try {
          if (typeof this.apiClient.batchUpdateAttendance === 'function') {
            const rPrime = this.computeTargetWeekRPrime(weekStr);
            await this._retryCall(() => this.apiClient.batchUpdateAttendance(campusId, weekStr, marks, unmarks, rPrime));
          }
          batchEntries.forEach(b => {
            b.item.syncedState = b.targetState;
            if (b.item.desiredState === b.item.syncedState) delete this.syncQueue[b.key];
          });
        } catch (e) {
          this.onToast(`儲存失敗：點名紀錄未能同步 (${e.message})`, 'error');
          const list = this.getCurrentCampusAttendance(campusId);
          batchEntries.forEach(b => {
            if (b.item.desiredState !== b.targetState) return;
            b.item.desiredState = b.item.syncedState;
            if (b.item.syncedState) {
              if (this.currentCampusId === campusId && this.currentWeekStr === b.item.weekStr) {
                this.weekIndex[b.item.type]?.add(b.item.name);
              }
              if (!list.some(r => r.name === b.item.name && r.week === b.item.weekStr && r.type === b.item.type)) {
                this._insertAttendanceSorted(list, { name: b.item.name, week: b.item.weekStr, type: b.item.type, role: b.item.role || '' });
              }
            } else {
              if (this.currentCampusId === campusId && this.currentWeekStr === b.item.weekStr) {
                this.weekIndex[b.item.type]?.delete(b.item.name);
              }
              const idx = list.findIndex(r => r.name === b.item.name && r.week === b.item.weekStr && r.type === b.item.type);
              if (idx !== -1) list.splice(idx, 1);
            }
          });
        } finally {
          this.isBatchSyncInFlight = false;
          this.onSyncStatusChange(this.getPendingCount());
          if (Object.keys(this.syncQueue).some(k => this.syncQueue[k].desiredState !== this.syncQueue[k].syncedState)) {
            this.scheduleBatchSync(true);
          }
        }
      }

      /**
       * 一鍵套用預設出席名單至當前週次（覆蓋原週次紀錄並即時同步至後端）
       * @param {Array<{ name: string, type: string, role: string }>} records 欲套用之紀錄
       * @returns {Promise<void>}
       */
      async applyDefaults(records) {
        const campusId = this.currentCampusId, weekStr = this.currentWeekStr;
        if (!campusId || !weekStr) throw new Error('未設定當前校園或週次');

        const list = this.getCurrentCampusAttendance(campusId);
        const filteredList = list.filter(r => r.week !== weekStr);
        this.attendanceByCampus[campusId] = filteredList;
        this.weekIndex = { '出席': new Set(), '禱告': new Set(), '傳福音': new Set() };

        (records || []).forEach(r => {
          this.weekIndex[r.type]?.add(r.name);
          this._insertAttendanceSorted(filteredList, { name: r.name, week: weekStr, type: r.type, role: r.role || '' });
        });

        this.attendanceChanged = true;
        for (const k in this.syncQueue) {
          if (this.syncQueue[k].campus === campusId && this.syncQueue[k].weekStr === weekStr) {
            delete this.syncQueue[k];
          }
        }
        this.onSyncStatusChange(this.getPendingCount());

        if (typeof this.apiClient.applyDefaultAttendance === 'function') {
          const rPrime = this.computeTargetWeekRPrime(weekStr);
          const result = await this.apiClient.applyDefaultAttendance(campusId, weekStr, records, rPrime);
          if (result && result.success === false) throw new Error(result.error || '伺服器套用失敗');
        }
      }

      /**
       * 成員改名時連動更新記憶體快取、當週索引與待同步隊列中的姓名
       * @param {string} oldName 舊姓名
       * @param {string} newName 新姓名
       */
      renameMember(oldName, newName) {
        if (!oldName || !newName || oldName === newName) return;
        const list = this.getCurrentCampusAttendance(this.currentCampusId);
        list.forEach(r => { if (r.name === oldName) r.name = newName; });
        for (const t in this.weekIndex) {
          if (this.weekIndex[t].has(oldName)) {
            this.weekIndex[t].delete(oldName);
            this.weekIndex[t].add(newName);
          }
        }
        for (const k of Object.keys(this.syncQueue)) {
          const item = this.syncQueue[k];
          if (item.campus === this.currentCampusId && item.name === oldName) {
            item.name = newName;
            const newKey = k.replace(`|${oldName}|`, `|${newName}|`);
            if (newKey !== k) {
              this.syncQueue[newKey] = item;
              delete this.syncQueue[k];
            }
          }
        }
      }

      /**
       * 成員刪除時同步自當週索引移除
       * @param {string} name 成員姓名
       */
      removeMember(name) {
        for (const t in this.weekIndex) this.weekIndex[t].delete(name);
      }

      /**
       * 切換當前週次（若超出已快取週次範圍，自動非同步預載歷史點名紀錄）
       * @param {string} targetWeekStr 目標週一日期 (YYYY-MM-DD)
       * @returns {Promise<void>}
       */
      async setWeek(targetWeekStr) {
        if (this.minLoadedWeek && this.minLoadedWeek !== '0000-00-00' && this.minLoadedWeek !== '__ALL__' && targetWeekStr < this.minLoadedWeek) {
          const targetDate = new Date(targetWeekStr + 'T00:00:00');
          targetDate.setDate(targetDate.getDate() - 12 * 7);
          const y = targetDate.getFullYear();
          const m = String(targetDate.getMonth() + 1).padStart(2, '0');
          const d = String(targetDate.getDate()).padStart(2, '0');
          await this.ensureAttendanceRange(`${y}-${m}-${d}`);
        }
        this.currentWeekStr = targetWeekStr;
        this._rebuildWeekIndex();
      }

      /**
       * 確保指定起始週（targetStartWeek）以上的點名資料已存在快取中
       * @param {string} targetStartWeek 目標起始週一 (YYYY-MM-DD)
       * @returns {Promise<boolean>}
       */
      async ensureAttendanceRange(targetStartWeek) {
        if (this.minLoadedWeek === '0000-00-00' || this.minLoadedWeek === '__ALL__') return true;
        if (targetStartWeek && this.minLoadedWeek && targetStartWeek >= this.minLoadedWeek) return true;
        if (this.isLoadingHistory) return false;
        this.isLoadingHistory = true;

        try {
          const curDate = new Date(this.minLoadedWeek + 'T00:00:00');
          curDate.setDate(curDate.getDate() - 7);
          const y = curDate.getFullYear();
          const m = String(curDate.getMonth() + 1).padStart(2, '0');
          const d = String(curDate.getDate()).padStart(2, '0');
          const endWeek = `${y}-${m}-${d}`;

          if (typeof this.apiClient.getAttendanceHistory === 'function') {
            const result = await this.apiClient.getAttendanceHistory(targetStartWeek || '', endWeek);
            if (result && result.success && result.data) {
              const newMin = (result.data.hasMore === false || !targetStartWeek) ? '0000-00-00' : targetStartWeek;
              this.mergeAttendanceHistory(result.data.attendanceByCampus, newMin);
              return true;
            }
          }
          return false;
        } catch (e) {
          this.onToast('載入歷史紀錄失敗：' + e.message, 'error');
          return false;
        } finally {
          this.isLoadingHistory = false;
        }
      }

      /**
       * 將更早的歷史點名紀錄頭部拼接 (unshift/concat) 至快取中
       * @param {Object.<string, Array>} historyByCampus 各校歷史點名紀錄
       * @param {string} [newMinLoadedWeek] 新的最小已載入週次
       */
      mergeAttendanceHistory(historyByCampus, newMinLoadedWeek) {
        if (!historyByCampus) return;
        for (const cid in historyByCampus) {
          const hist = historyByCampus[cid] || [];
          if (hist.length === 0) continue;
          const current = this.attendanceByCampus[cid] || [];
          this.attendanceByCampus[cid] = hist.concat(current);
        }
        if (newMinLoadedWeek) this.minLoadedWeek = newMinLoadedWeek;
        this._rebuildWeekIndex();
      }

      /**
       * 內部重試輔助函式（支援指數退避重試）
       * @private
       * @param {Function} fn 非同步操作函式
       * @returns {Promise<*>}
       */
      async _retryCall(fn) {
        for (let attempt = 1; attempt <= this.maxRetries; attempt++) {
          try {
            const result = await fn();
            if (result && result.success === false) throw new Error(result.error || '後端回傳失敗');
            return result;
          } catch (e) {
            if (attempt === this.maxRetries) throw e;
            await new Promise(r => setTimeout(r, 500 * Math.pow(2, attempt - 1)));
          }
        }
      }
    }

// ==========================================
// ===== MemberStore 前端深模組 =====
// ==========================================

/**
 * 人員清單標準排序函式（與後端 SpreadsheetRepository 規範 100% 一致）
 * 規則：出席次數降序 (count 較高者在先)；若次數相同則依姓名字串筆畫/語系升序 (a.name.localeCompare(b.name))
 * @param {Array} list 人員陣列
 * @returns {Array} 排序後的人員陣列原址參照
 */
function sortMemberList(list) {
  if (!Array.isArray(list)) return list;
  return list.sort((a, b) => {
    const countA = Number(a ? a.count : 0) || 0;
    const countB = Number(b ? b.count : 0) || 0;
    if (countB !== countA) return countB - countA;
    const nameA = (a && a.name) ? String(a.name) : '';
    const nameB = (b && b.name) ? String(b.name) : '';
    return nameA.localeCompare(nameB);
  });
}

/**
 * 成員管理 0ms 樂觀自動同步與回退管線深模組
 * 封裝隊列、防抖計時器、在途請求鎖、記憶體快照合併、改名聚合與失敗回退。
 */
class MemberStore {
  static sortMembers(list) {
    return sortMemberList(list);
  }
  /**
   * @param {Object} [options]
   * @param {Object} [options.apiClient] API Client 物件，需提供 applyMemberChanges(campusId, { changes })
   * @param {Function} [options.onSyncStatusChange] 同步狀態計數變更通知 (pendingCount) => void
   * @param {Function} [options.onToast] 提示通知 (msg, type) => void
   * @param {Function} [options.onSuccess] 儲存成功回調 (campusId, mergedMembers, affectedMembers, warnings) => void
   * @param {Function} [options.onRollback] 失敗回退回調 (campusId, batch, error) => void
   * @param {Function} [options.getCurrentCampusId] 取得當前校園 ID 的回調 () => string
   * @param {number} [options.debounceMs=400] 防抖時間（毫秒）
   */
  constructor(options = {}) {
    this.apiClient = options.apiClient || {};
    this.onSyncStatusChange = options.onSyncStatusChange || (() => {});
    this.onToast = options.onToast || (() => {});
    this.onSuccess = options.onSuccess || (() => {});
    this.onRollback = options.onRollback || (() => {});
    this.getCurrentCampusId = options.getCurrentCampusId || (() => null);
    this.debounceMs = options.debounceMs ?? 400;

    this.queue = []; // Array<{ campusId, change, rollbackFn }>
    this.isInFlight = false;
    this.timer = null;
  }

  /**
   * 取得目前正在排程或傳輸中的變更筆數
   * @returns {number}
   */
  getPendingCount() {
    return this.queue.length + (this.isInFlight ? 1 : 0);
  }

  /**
   * 取得內部隊列副本（測試與偵錯專用）
   * @returns {Array}
   */
  getQueue() {
    return this.queue;
  }

  /**
   * 設定內部隊列（測試與偵錯專用）
   * @param {Array} q
   */
  setQueue(q) {
    this.queue = Array.isArray(q) ? q : [];
  }

  /**
   * 將後端回傳的最新人員快照與前端尚在隊列中的變更進行記憶體內合併
   * 防止在 RPC 請求在途 (in-flight) 期間，使用者連續修改其他成員時，
   * 因舊快照返回而導致「1秒短暫回滾」閃爍現象。
   * 
   * @param {Array} serverMembers 伺服器回傳之人員名單
   * @param {Array|string} [pendingQueueOrCampusId] 待處理隊列（若未傳入則使用內部 queue）或 campusId
   * @param {string} [optionalCampusId] 校園 ID（若第 2 參數為 pendingQueue 時使用）
   * @returns {Array} 合併後的人員名單副本
   */
  mergeServerMembersWithPendingQueue(serverMembers, pendingQueueOrCampusId, optionalCampusId) {
    if (!Array.isArray(serverMembers)) return [];

    let pendingQueue;
    let campusId;

    if (Array.isArray(pendingQueueOrCampusId)) {
      pendingQueue = pendingQueueOrCampusId;
      campusId = optionalCampusId || this.getCurrentCampusId();
    } else {
      pendingQueue = this.queue;
      campusId = pendingQueueOrCampusId || this.getCurrentCampusId();
    }

    const merged = serverMembers.map(m => ({
      ...m,
      defaults: Array.isArray(m.defaults) ? [...m.defaults] : []
    }));

    let hasAddedOrRenamed = false;
    for (const item of pendingQueue) {
      if (campusId && item.campusId && item.campusId !== campusId) continue;
      const change = item.change;
      if (!change) continue;

      if (change.type === 'modify') {
        const targetName = change.oldName || change.name;
        const target = merged.find(m => m.name === targetName || (change.oldName && m.name === change.oldName));
        if (target) {
          if (change.name && change.name !== target.name) {
            hasAddedOrRenamed = true;
          }
          target.name = change.name;
          target.role = change.role;
          target.stage = change.stage;
          target.defaults = Array.isArray(change.defaults) ? [...change.defaults] : [];
          if (change.otherGroupId !== undefined) target.otherGroupId = change.otherGroupId;
        }
      } else if (change.type === 'add') {
        if (!merged.some(m => m.name === change.name)) {
          merged.push({
            name: change.name,
            count: 0,
            role: change.role,
            stage: change.stage,
            defaults: Array.isArray(change.defaults) ? [...change.defaults] : [],
            otherGroupId: change.otherGroupId || ''
          });
          hasAddedOrRenamed = true;
        }
      } else if (change.type === 'delete') {
        const idx = merged.findIndex(m => m.name === change.name || (change.oldName && m.name === change.oldName));
        if (idx !== -1) merged.splice(idx, 1);
      }
    }
    if (hasAddedOrRenamed) {
      sortMemberList(merged);
    }
    return merged;
  }

  /**
   * 排程人員變更（支援多態呼叫：(campusId, change, rollbackFn, immediate) 或 (change, rollbackFn, immediate)）
   * 包含隊列聚合、改名鏈追蹤、自我消除等深模組行為。
   */
  scheduleMemberSync(campusIdOrChange, changeOrRollback, rollbackOrImmediate, immediate = false) {
    let targetCampusId, change, rollbackFn, isImmediate;

    if (typeof campusIdOrChange === 'string') {
      targetCampusId = campusIdOrChange;
      change = changeOrRollback;
      rollbackFn = rollbackOrImmediate;
      isImmediate = Boolean(immediate);
    } else {
      change = campusIdOrChange;
      rollbackFn = changeOrRollback;
      isImmediate = Boolean(rollbackOrImmediate);
      targetCampusId = (change && change.campusId) || this.getCurrentCampusId();
    }

    if (change) {
      if (change.type === 'modify') {
        const targetName = change.oldName || change.name;
        const existing = this.queue.find(item =>
          item.campusId === targetCampusId &&
          item.change && (
            (item.change.type === 'modify' && (item.change.name === targetName || (item.change.oldName && item.change.oldName === targetName))) ||
            (item.change.type === 'add' && item.change.name === targetName)
          )
        );
        if (existing) {
          if (existing.change.type === 'add') {
            existing.change.name = change.name;
            existing.change.role = change.role;
            existing.change.stage = change.stage;
            existing.change.defaults = Array.isArray(change.defaults) ? [...change.defaults] : [];
            if (change.otherGroupId !== undefined) existing.change.otherGroupId = change.otherGroupId;
          } else {
            const originalOldName = existing.change.oldName || existing.change.name;
            existing.change = change;
            if (originalOldName) {
              existing.change.oldName = originalOldName;
            }
          }
        } else {
          this.queue.push({ campusId: targetCampusId, change, rollbackFn });
        }
      } else if (change.type === 'delete') {
        const addIndex = this.queue.findIndex(item =>
          item.campusId === targetCampusId && item.change && item.change.type === 'add' && item.change.name === change.name
        );
        if (addIndex !== -1) {
          this.queue.splice(addIndex, 1);
        } else {
          this.queue.push({ campusId: targetCampusId, change, rollbackFn });
        }
      } else {
        this.queue.push({ campusId: targetCampusId, change, rollbackFn });
      }
    }

    this.onSyncStatusChange(this.getPendingCount());

    if (this.timer) {
      clearTimeout(this.timer);
      this.timer = null;
    }

    if (isImmediate) {
      this.flushMemberSync();
      return;
    }

    this.timer = setTimeout(() => {
      this.timer = null;
      this.flushMemberSync();
    }, this.debounceMs);
  }

  /**
   * 立即將佇列批次送至伺服器，處理回滾與記憶體快照同步
   */
  async flushMemberSync() {
    if (this.isInFlight) return;

    if (this.timer) {
      clearTimeout(this.timer);
      this.timer = null;
    }

    if (this.queue.length === 0) {
      this.onSyncStatusChange(this.getPendingCount());
      return;
    }

    const targetCampusId = this.queue[0].campusId || this.getCurrentCampusId();
    if (!targetCampusId) return;

    const batch = [];
    const remaining = [];
    for (const item of this.queue) {
      if (item.campusId === targetCampusId) batch.push(item);
      else remaining.push(item);
    }
    this.queue = remaining;

    const changes = batch.map(b => b.change);
    this.isInFlight = true;
    this.onSyncStatusChange(this.getPendingCount());

    try {
      if (typeof this.apiClient.applyMemberChanges !== 'function') {
        throw new Error('apiClient.applyMemberChanges 未定義');
      }

      const result = await this.apiClient.applyMemberChanges(targetCampusId, { changes });
      if (result && result.success) {
        let merged = null;
        if (Array.isArray(result.members)) {
          merged = this.mergeServerMembersWithPendingQueue(result.members, this.queue, targetCampusId);
        }

        this.onSuccess(targetCampusId, merged, result.affectedMembers, result.warnings);

        if (result.warnings && result.warnings.length > 0) {
          this.onToast(`已儲存名單（部分衝突已自動排除）：\n${result.warnings.join('\n')}`, 'warning');
        } else if (this.queue.length === 0) {
          this.onToast('人員變更已自動儲存', 'success');
        }
      } else {
        throw new Error(result && result.error ? result.error : '伺服器儲存失敗');
      }
    } catch (e) {
      for (let i = batch.length - 1; i >= 0; i--) {
        if (typeof batch[i].rollbackFn === 'function') {
          try { batch[i].rollbackFn(); } catch (err) {}
        }
      }
      this.onRollback(targetCampusId, batch, e);
      this.onToast(`人員儲存失敗 (${e.message})，已自動復原名單`, 'error');
    } finally {
      this.isInFlight = false;
      this.onSyncStatusChange(this.getPendingCount());
      if (this.queue.length > 0) {
        this.scheduleMemberSync(null, null, null, true);
      }
    }
  }

  /**
   * 與 flushMemberSync 等價之語法糖
   */
  flush() {
    return this.flushMemberSync();
  }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { MemberStore, sortMemberList };
}


// ==========================================
// ===== CampusStore 前端深模組 =====
// ==========================================

/**
 * 小排管理 0ms 樂觀自動同步與回退管線深模組
 * 封裝排序序號正規化、分類分組、防抖計時器、快照比對 (防止無實質變更的無意義儲存) 與失敗回退。
 */
class CampusStore {
  /**
   * @param {Object} [options]
   * @param {Object} [options.apiClient] API Client 物件，需提供 applyCampusChanges(campuses)
   * @param {Function} [options.onSyncStatusChange] 同步狀態計數變更通知 (pendingCount) => void
   * @param {Function} [options.onToast] 提示通知 (msg, type) => void
   * @param {Function} [options.onSuccess] 儲存成功回調 () => void
   * @param {Function} [options.onRollback] 失敗回退回調 (rollbackSnapshot, error) => void
   * @param {Function} [options.getCurrentCampuses] 取得當前校園狀態回調 () => { campuses, archivedCampuses }
   * @param {number} [options.debounceMs=400] 防抖時間（毫秒）
   */
  constructor(options = {}) {
    this.apiClient = options.apiClient || {};
    this.onSyncStatusChange = options.onSyncStatusChange || (() => {});
    this.onToast = options.onToast || (() => {});
    this.onSuccess = options.onSuccess || (() => {});
    this.onRollback = options.onRollback || (() => {});
    this.getCurrentCampuses = options.getCurrentCampuses || (() => ({ campuses: [], archivedCampuses: [] }));
    this.debounceMs = options.debounceMs ?? 400;

    this.timer = null;
    this.isInFlight = false;
    this.rollbackSnapshot = null;
    this.hasPending = false;
  }

  /**
   * 建立當前校園狀態深拷貝快照
   * @param {Array} campuses 啟用校園清單
   * @param {Array} archivedCampuses 封存校園清單
   * @returns {{ campuses: Array, archivedCampuses: Array }}
   */
  captureSnapshot(campuses, archivedCampuses) {
    return {
      campuses: JSON.parse(JSON.stringify(campuses || [])),
      archivedCampuses: JSON.parse(JSON.stringify(archivedCampuses || []))
    };
  }

  /**
   * 比對兩個校園清單是否實質完全一致
   * @param {Array} listA
   * @param {Array} listB
   * @returns {boolean}
   */
  areCampusListsEqual(listA, listB) {
    if (!Array.isArray(listA) || !Array.isArray(listB)) return false;
    if (listA.length !== listB.length) return false;
    for (let i = 0; i < listA.length; i++) {
      const a = listA[i];
      const b = listB[i];
      if (a.id !== b.id || a.name !== b.name || a.category !== b.category || (a.sort || 0) !== (b.sort || 0)) {
        return false;
      }
    }
    return true;
  }

  /**
   * 取得目前正在排程或傳輸中的校園同步筆數
   * @returns {number}
   */
  getPendingCount() {
    return (this.hasPending ? 1 : 0) + (this.isInFlight ? 1 : 0);
  }

  /**
   * 檢查是否有未完成之校園排程或待同步快照
   * @returns {boolean}
   */
  hasPendingSync() {
    return this.hasPending || Boolean(this.rollbackSnapshot);
  }

  /**
   * 重新正規化校園排序號與分類順序
   * @param {Array} campuses
   */
  reorderAndSortCampuses(campuses) {
    if (!Array.isArray(campuses)) return;

    // 重新整理排序序號
    const groups = {};
    campuses.forEach(c => {
      const cat = c.category || '其他';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(c);
    });
    Object.values(groups).forEach(list => {
      list.sort((a, b) => (a.sort || 0) - (b.sort || 0)).forEach((c, idx) => {
        c.sort = idx + 1;
      });
    });

    // 依類別與序號排序 campuses 保持與試算表實體列一致
    const categoryOrder = { '高中': 1, '國中': 2, '社區排': 3 };
    campuses.sort((a, b) => {
      const catA = categoryOrder[a.category] || 99;
      const catB = categoryOrder[b.category] || 99;
      if (catA !== catB) return catA - catB;
      return (a.sort || 0) - (b.sort || 0);
    });
  }

  /**
   * 排程小排同步（支援立即送出或防抖延遲）
   * @param {Object} [prevSnapshot] 操作前回退快照
   * @param {boolean} [immediate=false] 是否立即 flush
   */
  scheduleCampusSync(prevSnapshot, immediate = false) {
    this.hasPending = true;
    if (!this.rollbackSnapshot && prevSnapshot) {
      this.rollbackSnapshot = prevSnapshot;
    }
    this.onSyncStatusChange(this.getPendingCount());

    if (this.timer) {
      clearTimeout(this.timer);
      this.timer = null;
    }

    if (immediate) {
      this.flushCampusSync();
      return;
    }

    this.timer = setTimeout(() => {
      this.timer = null;
      this.flushCampusSync();
    }, this.debounceMs);
  }

  /**
   * 立即將校園變更批次同步至後端試算表
   * @param {Array} [currentCampuses] 當前啟用校園清單
   * @param {Array} [currentArchivedCampuses] 當前封存校園清單
   */
  async flushCampusSync(currentCampuses, currentArchivedCampuses) {
    if (this.isInFlight) return;

    if (this.timer) {
      clearTimeout(this.timer);
      this.timer = null;
    }

    if (!this.hasPending) {
      this.onSyncStatusChange(this.getPendingCount());
      return;
    }

    this.hasPending = false;
    const rollback = this.rollbackSnapshot;
    this.rollbackSnapshot = null;
    this.isInFlight = true;
    this.onSyncStatusChange(this.getPendingCount());

    const activeCampuses = currentCampuses || this.getCurrentCampuses().campuses || [];
    const archivedCampuses = currentArchivedCampuses || this.getCurrentCampuses().archivedCampuses || [];

    this.reorderAndSortCampuses(activeCampuses);

    // 檢查是否與 rollback 快照完全一致（無實質變更時避免無意義儲存與網路請求）
    if (rollback &&
        this.areCampusListsEqual(rollback.campuses, activeCampuses) &&
        this.areCampusListsEqual(rollback.archivedCampuses, archivedCampuses)) {
      this.isInFlight = false;
      this.onSyncStatusChange(this.getPendingCount());
      return;
    }

    try {
      if (typeof this.apiClient.applyCampusChanges !== 'function') {
        throw new Error('apiClient.applyCampusChanges 未定義');
      }

      const allCampusesToSave = [
        ...activeCampuses.map(c => ({ ...c, isArchived: false })),
        ...archivedCampuses.map(c => ({ ...c, isArchived: true }))
      ];

      const result = await this.apiClient.applyCampusChanges(allCampusesToSave);
      if (result && result.success) {
        this.onSuccess();
        this.onToast('小排變更已自動儲存', 'success');
      } else {
        throw new Error(result && result.error ? result.error : '儲存失敗');
      }
    } catch (e) {
      this.onRollback(rollback, e);
      this.onToast(`小排儲存失敗 (${e.message})，已自動復原`, 'error');
    } finally {
      this.isInFlight = false;
      this.onSyncStatusChange(this.getPendingCount());
      if (this.hasPending) {
        this.scheduleCampusSync(null, true);
      }
    }
  }

  /**
   * 與 flushCampusSync 等價之語法糖
   */
  flush() {
    return this.flushCampusSync();
  }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { CampusStore };
}


/**
 * stats_aggregator.js
 * 
 * 統計計算與時間軸深模組（純資料運算、零 DOM、零樣式字串）
 * 包含：
 * 1. Timeline: 時間軸、週次動態生成與日期間距平移工具（以週日代表當週區間）
 * 2. StatsAggregator: 多維索引構建、排除服事者/家長、扣除暫停週、計算 KPI 與校園排行榜
 */

/**
 * Timeline
 * 時間軸與週次計算工具（純函式、無 DOM 依賴）
 * 統一以「週日」代表當週區間（對齊點名應用規範）
 */
const Timeline = {
  /** 格式化日期為 YYYY-MM-DD */
  formatDate(date) {
    if (!date) return '';
    const d = (date instanceof Date) ? date : new Date(date);
    if (isNaN(d.getTime())) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  },

  /** 取得給定日期的週一日期（時間歸零） */
  getMonday(date) {
    let d;
    if (typeof date === 'string' && /^\d{4}-\d{2}-\d{2}/.test(date)) {
      const parts = date.slice(0, 10).split('-').map(Number);
      d = new Date(parts[0], parts[1] - 1, parts[2]);
    } else if (date) {
      d = new Date(date);
    } else {
      d = new Date();
    }
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const monday = new Date(d);
    monday.setDate(d.getDate() + diff);
    monday.setHours(0, 0, 0, 0);
    return monday;
  },

  /** 取得給定日期所在週的週日日期（代表該週日期，時間歸零） */
  getSunday(date) {
    const mon = this.getMonday(date);
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    sun.setHours(0, 0, 0, 0);
    return sun;
  },

  /** 取得當前週的最新週日字串（最大允許迄日） */
  getMaxAllowedSundayStr(refDate = new Date()) {
    return this.formatDate(this.getSunday(refDate));
  },

  /**
   * 計算最近 N 週的區間 [startDate, endDate]（均為週日 YYYY-MM-DD）
   * @param {number} count 週數（如 10, 20）
   * @param {Date|string} [refDate] 參考基準日（預設為今天）
   */
  recentWeeks(count, refDate = new Date()) {
    const curSun = this.getSunday(refDate);
    const startSun = new Date(curSun);
    startSun.setDate(curSun.getDate() - (count - 1) * 7);
    return {
      startDate: this.formatDate(startSun),
      endDate: this.formatDate(curSun)
    };
  },

  /**
   * 計算學期區間 [startDate, endDate]（均為週日 YYYY-MM-DD）
   * @param {number} year 年份
   * @param {'SPRING'|'AUTUMN'|'CURRENT'} term 學期別
   * @param {Date|string} [refDate] 參考基準日
   */
  semester(year, term = 'CURRENT', refDate = new Date()) {
    const curSun = this.getSunday(refDate);
    let isSpring;
    if (term === 'SPRING') {
      isSpring = true;
    } else if (term === 'AUTUMN') {
      isSpring = false;
    } else {
      const refD = (refDate instanceof Date) ? refDate : new Date(refDate);
      const m = refD.getMonth() + 1;
      isSpring = (m >= 2 && m <= 7);
    }

    const startM = isSpring ? 3 : 9;
    const endM = isSpring ? 6 : 12;
    const sSun = this.getSunday(new Date(year, startM - 1, 1));
    const lastDayOfEndM = new Date(year, endM, 0);
    let eSun = this.getSunday(lastDayOfEndM);

    // 若學期仍在進行中，結束週日不可超過基準週日
    if (eSun > curSun) {
      eSun = curSun;
    }

    return {
      startDate: this.formatDate(sSun),
      endDate: this.formatDate(eSun)
    };
  },

  /**
   * 平移時間軸窗口
   * @param {string} startDate 起始週日 YYYY-MM-DD
   * @param {string} endDate 結束週日 YYYY-MM-DD
   * @param {number} deltaWeeks 平移週數（負為往過去，正為往未來）
   * @param {Date|string} [maxSun] 最大允許週日（預設為基準週日）
   */
  shift(startDate, endDate, deltaWeeks, maxSun = this.getSunday(new Date())) {
    const sParts = startDate.split('-').map(Number);
    const eParts = endDate.split('-').map(Number);
    const s = new Date(sParts[0], sParts[1] - 1, sParts[2]);
    let e = new Date(eParts[0], eParts[1] - 1, eParts[2]);

    s.setDate(s.getDate() + deltaWeeks * 7);
    e.setDate(e.getDate() + deltaWeeks * 7);

    const maxLimit = (maxSun instanceof Date) ? maxSun : this.getSunday(maxSun);
    if (e > maxLimit) {
      const diffDays = Math.round((e.getTime() - maxLimit.getTime()) / (24 * 3600 * 1000));
      e = new Date(maxLimit);
      s.setDate(s.getDate() - diffDays);
    }

    return {
      startDate: this.formatDate(s),
      endDate: this.formatDate(e)
    };
  },

  /**
   * 根據起訖週日動態展開所有週次資訊清單
   * @param {string} startDate 起始週日 YYYY-MM-DD
   * @param {string} endDate 結束週日 YYYY-MM-DD
   * @returns {Array<{ weekStr: string, sunStr: string, shortLabel: string, label: string, monday: Date, sunday: Date }>}
   */
  buildWeekList(startDate, endDate) {
    if (!startDate || !endDate) return [];
    const sParts = startDate.split('-').map(Number);
    const eParts = endDate.split('-').map(Number);
    const startSun = this.getSunday(new Date(sParts[0], sParts[1] - 1, sParts[2]));
    const endSun = this.getSunday(new Date(eParts[0], eParts[1] - 1, eParts[2]));
    if (startSun > endSun) return [];

    const weeks = [];
    const curSun = new Date(startSun);
    while (curSun <= endSun) {
      const sun = new Date(curSun);
      const mon = this.getMonday(sun);
      const monStr = this.formatDate(mon);
      const sunStr = this.formatDate(sun);
      const shortLabel = `${sun.getMonth() + 1}/${sun.getDate()}`;
      const fullLabel = `${mon.getFullYear()}/${mon.getMonth() + 1}/${mon.getDate()} ~ ${sun.getMonth() + 1}/${sun.getDate()}`;

      weeks.push({
        weekStr: monStr, // 週一字串（對齊後端點名原始資料的週次記錄）
        sunStr: sunStr,   // 週日字串
        shortLabel: shortLabel,
        label: fullLabel,
        monday: mon,
        sunday: sun
      });

      curSun.setDate(curSun.getDate() + 7);
    }
    return weeks;
  }
};

/**
 * StatsAggregator
 * 統計指標計算深模組（純資料運算、零 DOM、零樣式字串）
 * 集中管理多維點名比對索引、週次截斷、暫停週排除、KPI 計算與校園排行榜狀態機。
 */
const StatsAggregator = {
  /**
   * 聚合統計數據
   * @param {Object} params
   * @param {Object} [params.attendanceByCampus] 各校點名紀錄快取 { [campusId]: Array<{week, type, name, role}> }
   * @param {Array} [params.campuses] 校園清單 [{id, name, category, suspendedWeeks: []}]
   * @param {string} params.startDate 起始週日 (YYYY-MM-DD)
   * @param {string} params.endDate 結束週日 (YYYY-MM-DD)
   * @param {string} [params.targetCampusId='ALL'] 目標校園 ID 或 'ALL'
   * @param {boolean} [params.excludeSuspended=false] 是否排除暫停週（僅在指定個別校園時生效）
   * @returns {Object} 統計報告（純量領域模型，不包含 HTML/CSS/Chart.js 樣式）
   */
  aggregate({
    attendanceByCampus = {},
    campuses = [],
    startDate,
    endDate,
    targetCampusId = 'ALL',
    excludeSuspended = false
  } = {}) {
    // 1. 動態展開週次清單
    const weeks = Timeline.buildWeekList(startDate, endDate);

    // 2. 構建全域點名比對索引（排除服事者/家長，直接依點名紀錄篩選）
    const attMap = {};    // key: campusId|normWeek|type -> Set<name>
    const gospelMap = {}; // key: campusId|normWeek -> Set<gospelName>

    for (const [cid, recList] of Object.entries(attendanceByCampus || {})) {
      if (!Array.isArray(recList)) continue;
      for (const r of recList) {
        if (!r || r.role === '服事者/家長') continue;

        const normWeek = (r.week || '').replace(/[/\.]/g, '-').slice(0, 10);
        const key = cid + '|' + normWeek + '|' + r.type;
        if (!attMap[key]) attMap[key] = new Set();
        attMap[key].add(r.name);

        if (r.type === '出席' && (r.role === '男界朋友' || r.role === '女界朋友')) {
          const gKey = cid + '|' + normWeek;
          if (!gospelMap[gKey]) gospelMap[gKey] = new Set();
          gospelMap[gKey].add(r.name);
        }
      }
    }

    // 3. 確定目標校園與暫停週排除
    const activeCampuses = Array.isArray(campuses) ? campuses : [];
    const targetCampuses = targetCampusId === 'ALL'
      ? activeCampuses
      : activeCampuses.filter(c => c.id === targetCampusId);

    const selectedCampus = (targetCampusId !== 'ALL')
      ? (activeCampuses.find(c => c.id === targetCampusId) || null)
      : null;

    const suspendedWeeks = (selectedCampus && Array.isArray(selectedCampus.suspendedWeeks))
      ? selectedCampus.suspendedWeeks
      : [];

    const isExcluding = !!(selectedCampus && excludeSuspended && suspendedWeeks.length > 0);
    const effectiveWeeks = isExcluding
      ? weeks.filter(w => !suspendedWeeks.includes(w.weekStr))
      : weeks;
    const suspendedCount = weeks.length - effectiveWeeks.length;

    // 4. 計算走勢數列與彙總
    const labels = effectiveWeeks.map(w => w.shortLabel);
    const attendSeries = [];
    const gospelSeries = [];
    const praySeries = [];
    const outreachSeries = [];
    let totalAttendSum = 0;
    let totalGospelSum = 0;
    let latestAttendCount = 0;
    let prevAttendCount = 0;
    let latestGospelCount = 0;
    let latestWeekLabel = '';

    effectiveWeeks.forEach((w, idx) => {
      let weekAttend = 0;
      let weekGospel = 0;
      let weekPray = 0;
      let weekOutreach = 0;

      for (const c of targetCampuses) {
        const attendKey = c.id + '|' + w.weekStr + '|出席';
        weekAttend += (attMap[attendKey] || new Set()).size;

        const gKey = c.id + '|' + w.weekStr;
        weekGospel += (gospelMap[gKey] || new Set()).size;

        const prayKey = c.id + '|' + w.weekStr + '|禱告';
        weekPray += (attMap[prayKey] || new Set()).size;

        const outreachKey = c.id + '|' + w.weekStr + '|傳福音';
        weekOutreach += (attMap[outreachKey] || new Set()).size;
      }

      attendSeries.push(weekAttend);
      gospelSeries.push(weekGospel);
      praySeries.push(weekPray);
      outreachSeries.push(weekOutreach);
      totalAttendSum += weekAttend;
      totalGospelSum += weekGospel;

      if (idx === effectiveWeeks.length - 1) {
        latestAttendCount = weekAttend;
        latestGospelCount = weekGospel;
        latestWeekLabel = w.shortLabel;
      }
      if (idx === effectiveWeeks.length - 2) {
        prevAttendCount = weekAttend;
      }
    });

    // 5. 計算三大 KPI 指標（平均出席、平均福音朋友、活躍福音朋友）
    const avgAttend = effectiveWeeks.length > 0 ? (totalAttendSum / effectiveWeeks.length) : 0;
    const avgGospel = effectiveWeeks.length > 0 ? (totalGospelSum / effectiveWeeks.length) : 0;

    const gospelFriendAttendanceCounts = {}; // key: campusId|name -> 出席次數
    effectiveWeeks.forEach(w => {
      for (const c of targetCampuses) {
        const gSet = gospelMap[c.id + '|' + w.weekStr];
        if (gSet) {
          gSet.forEach(name => {
            const fKey = c.id + '|' + name;
            gospelFriendAttendanceCounts[fKey] = (gospelFriendAttendanceCounts[fKey] || 0) + 1;
          });
        }
      }
    });

    const totalFriends = Object.keys(gospelFriendAttendanceCounts).length;
    let threshold = 0;
    let activeFriendsCount = 0;
    if (totalFriends > 0) {
      threshold = totalGospelSum / totalFriends;
      activeFriendsCount = Object.values(gospelFriendAttendanceCounts).filter(cnt => cnt > threshold).length;
    }

    // 6. 計算跨校園數據排行（依全體 activeCampuses 於原始 weeks 區間統計並由高到低排序）
    const latestWeekStr = weeks.length > 0 ? weeks[weeks.length - 1].weekStr : '';
    const prevWeekStr = weeks.length > 1 ? weeks[weeks.length - 2].weekStr : '';

    const campusRankings = activeCampuses.map(c => {
      let cAttendSum = 0;
      let cGospelSum = 0;
      let cLatestAttend = 0;
      let cPrevAttend = 0;

      weeks.forEach((w, idx) => {
        const attendKey = c.id + '|' + w.weekStr + '|出席';
        const attendCount = (attMap[attendKey] || new Set()).size;
        cAttendSum += attendCount;

        const gKey = c.id + '|' + w.weekStr;
        cGospelSum += (gospelMap[gKey] || new Set()).size;

        if (idx === weeks.length - 1) cLatestAttend = attendCount;
        if (idx === weeks.length - 2) cPrevAttend = attendCount;
      });

      const cAvg = weeks.length > 0 ? (cAttendSum / weeks.length) : 0;
      const cSuspended = Array.isArray(c.suspendedWeeks) ? c.suspendedWeeks : [];
      const isLatestSuspended = latestWeekStr ? cSuspended.includes(latestWeekStr) : false;
      const isPrevSuspended = prevWeekStr ? cSuspended.includes(prevWeekStr) : false;

      let trendStatus = 'FLAT';
      const diff = cLatestAttend - cPrevAttend;

      if (isLatestSuspended) {
        trendStatus = 'THIS_WEEK_SUSPENDED';
      } else if (isPrevSuspended) {
        trendStatus = 'PREV_WEEK_SUSPENDED';
      } else if (diff > 0) {
        trendStatus = 'UP';
      } else if (diff < 0) {
        trendStatus = 'DOWN';
      } else {
        trendStatus = 'FLAT';
      }

      return {
        id: c.id,
        name: c.name,
        category: c.category || '',
        latestAttend: cLatestAttend,
        prevAttend: cPrevAttend,
        avgAttend: parseFloat(cAvg.toFixed(1)),
        formattedAvg: cAvg.toFixed(1),
        gospelTotal: cGospelSum,
        trendStatus,
        diff
      };
    });

    campusRankings.sort((a, b) => b.avgAttend - a.avgAttend);

    return {
      window: {
        startDate,
        endDate,
        totalWeeks: weeks.length,
        effectiveWeeksCount: effectiveWeeks.length,
        suspendedCount,
        isExcludingSuspended: isExcluding,
        weeks,
        effectiveWeeks
      },
      series: {
        labels,
        attend: attendSeries,
        gospel: gospelSeries,
        pray: praySeries,
        outreach: outreachSeries
      },
      latest: {
        attend: latestAttendCount,
        prevAttend: prevAttendCount,
        gospel: latestGospelCount,
        weekLabel: latestWeekLabel
      },
      kpis: {
        attendance: {
          total: totalAttendSum,
          avg: parseFloat(avgAttend.toFixed(1)),
          formattedAvg: avgAttend.toFixed(1)
        },
        gospel: {
          total: totalGospelSum,
          avg: parseFloat(avgGospel.toFixed(1)),
          formattedAvg: avgGospel.toFixed(1)
        },
        activeGospel: {
          count: activeFriendsCount,
          totalFriends: totalFriends,
          threshold: parseFloat(threshold.toFixed(1)),
          formattedThreshold: threshold.toFixed(1)
        }
      },
      campusRankings
    };
  },

  /**
   * 排序各校明細排行名單（純函式運算，不修改原陣列）
   * 
   * 排序規範：
   * 1. 走勢權重：本週暫停視為 -2000、上週暫停視為 -1000、其餘按點名差額 (最新週 - 前一週)。
   * 2. 平手打破 (Tie-breaker)：主排序數值相同時啟用同向次要排序（主升則次升、主降則次降）。
   *    - 主排序非 avgAttend 時次要比 avgAttend；主排序為 avgAttend 時次要比 latestAttend。
   *    - 若仍相同，最後以校園名稱繁體筆畫 (localeCompare zh-Hant) 做確定性平手打破。
   * 
   * @param {Array<Object>} rankings 各校明細清單
   * @param {string} [column='avgAttend'] 排序欄位 ('name' | 'latestAttend' | 'avgAttend' | 'gospelTotal' | 'trend')
   * @param {string} [direction='desc'] 排序方向 ('desc' | 'asc')
   * @returns {Array<Object>} 排序後的全新陣列
   */
  sortRankings(rankings, column = 'avgAttend', direction = 'desc') {
    if (!Array.isArray(rankings)) return [];
    const list = [...rankings];
    const mult = (direction === 'asc') ? 1 : -1;

    const getTrendScore = (item) => {
      if (!item) return 0;
      const status = item.trendStatus || '';
      if (status === 'THIS_WEEK_SUSPENDED' || status === '本週暫停' || status === '本周暫停') {
        return -2000;
      }
      if (status === 'PREV_WEEK_SUSPENDED' || status === '上週暫停') {
        return -1000;
      }
      return Number(item.diff) || 0;
    };

    return list.sort((a, b) => {
      let diff = 0;
      if (column === 'name') {
        diff = (a.name || '').localeCompare(b.name || '', 'zh-Hant');
      } else if (column === 'latestAttend') {
        diff = (Number(a.latestAttend) || 0) - (Number(b.latestAttend) || 0);
      } else if (column === 'gospelTotal') {
        diff = (Number(a.gospelTotal) || 0) - (Number(b.gospelTotal) || 0);
      } else if (column === 'trend') {
        diff = getTrendScore(a) - getTrendScore(b);
      } else {
        // 預設 avgAttend
        diff = (Number(a.avgAttend) || 0) - (Number(b.avgAttend) || 0);
      }

      if (diff !== 0) return mult * diff;

      // 主要排序數字相同時啟用次要排序：次要排序方向與主要排序保持一致 (升序即升序，降序即降序)
      // 若主排序非 avgAttend 則次要比 avgAttend；若主排序為 avgAttend 則次要比 latestAttend
      let secDiff = 0;
      if (column !== 'avgAttend') {
        secDiff = (Number(a.avgAttend) || 0) - (Number(b.avgAttend) || 0);
      } else {
        secDiff = (Number(a.latestAttend) || 0) - (Number(b.latestAttend) || 0);
      }

      if (secDiff !== 0) return mult * secDiff;

      // 若仍平手，最後以校園名稱做確定性排序
      return (a.name || '').localeCompare(b.name || '', 'zh-Hant');
    });
  }
};


    // ===== 伺服器端預載資料 (Server-side Injected Data) =====
    // SERVER_PRELOADED_DATA 由宿主 HTML 在全域預先注入（若未定義則預設為 null）
    if (typeof SERVER_PRELOADED_DATA === 'undefined') {
      var SERVER_PRELOADED_DATA = null;
    }

    // ===== 應用程式狀態 =====
    const state = {
      campuses: [],           // [{id, name, category, sort}]
      archivedCampuses: [],   // [{id, name, category, sort, isArchived}]
      campusesSnapshot: null, // 校園編輯模式快照 (JSON string)
      membersByCampus: {},    // { [campusId]: [{name, count, role, defaults: [...]}, ...] } 全校人員快取
      currentCampusId: null,  // 當前選中的校園 ID（用於後端呼叫）
      currentCampus: null,    // 當前選中的校園名稱（用於顯示）
      members: [],            // 當前選中校園的人員名單
      membersSnapshot: null,  // 人員編輯模式快照 (JSON string)
      nameChanges: [],        // 編輯模式中的改名歷程 [{oldName, newName}]
      weekOffset: 0,          // 0=本週, -1=上週, 1=下週
      campusEditMode: false,  // 校園編輯模式
      memberEditMode: false,  // 人員編輯模式
      roleFilter: '全部',     // 身分篩選（'全部' = 不篩選）
      searchQuery: '',        // 姓名搜尋關鍵字（已忽略空白）
      filterPanelOpen: false, // 篩選面板開關狀態
      helpPanelOpen: false,   // 說明面板開關狀態
      confirmCallback: null   // 確認對話框的回調函式
    };

    // ===== 校園與分類領域規則 =====
    const CampusDomain = {
      COMMUNITY_CATEGORY: '社區排',
      SCHOOL_CATEGORIES: ['國中', '高中'],

      /**
       * 解析校園物件或分類字串之分類名稱
       * @param {Object|string} campusOrCat 校園物件或分類字串
       * @returns {string} 分類名稱（如 '國中', '高中', '社區排'）
       */
      getCat(campusOrCat) {
        if (!campusOrCat) return '';
        return (typeof campusOrCat === 'string') ? campusOrCat : (campusOrCat.category || '');
      },

      /**
       * 判斷是否為學生校園排（國中或高中）
       * @param {Object|string} campusOrCat 校園物件或分類字串
       * @returns {boolean}
       */
      isSchool(campusOrCat) {
        return this.SCHOOL_CATEGORIES.includes(this.getCat(campusOrCat));
      },

      /**
       * 判斷是否為社區排
       * @param {Object|string} campusOrCat 校園物件或分類字串
       * @returns {boolean}
       */
      isCommunity(campusOrCat) {
        return this.getCat(campusOrCat) === this.COMMUNITY_CATEGORY;
      }
    };

    // ===== 工具函式 =====

    /** 顯示 loading */
    function showLoading() {
      document.getElementById('loading').classList.add('active');
    }

    /** 隱藏 loading */
    function hideLoading() {
      document.getElementById('loading').classList.remove('active');
    }

    /** 顯示 toast 通知 */
    function showToast(message, type = '') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast' + (type ? ' ' + type : '');
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    let savedBodyScrollY = 0;

    /** 開啟 modal */
    function openModal(id) {
      if (!document.body.classList.contains('modal-open')) {
        savedBodyScrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
        document.body.style.top = `-${savedBodyScrollY}px`;
        document.body.classList.add('modal-open');
      }

      const modalEl = document.getElementById(id);
      if (modalEl) modalEl.classList.add('active');

      // 重置身分與預設值選擇器
      if (id === 'modal-add-member') {
        document.querySelectorAll('#role-selector .role-btn').forEach(b => b.classList.remove('selected'));
        setSelectedDefaults('add-defaults-selector', []);

        const currentCampus = state.campuses.find(c => c.id === state.currentCampusId) ||
                              (state.archivedCampuses && state.archivedCampuses.find(c => c.id === state.currentCampusId));
        const isComm = CampusDomain.isCommunity(currentCampus);

        const campusBox = document.getElementById('add-campus-group-box');
        if (campusBox) {
          campusBox.style.display = isComm ? 'block' : 'none';
          if (isComm) {
            populateCampusOptions('add-member-other-campus', '');
          }
        }

        const defaultStage = CampusDomain.isSchool(currentCampus) ? CampusDomain.getCat(currentCampus) : '高中';
        setStageSelector('add-stage-selector', defaultStage);
      }

      // 重置新增校園對話框狀態
      if (id === 'modal-add-campus') {
        const nameInput = document.getElementById('input-campus-name');
        if (nameInput) nameInput.value = '';
        setCampusCategorySelector('add', '高中');
      }

      // 自動聚焦第一個可見 input（僅限非觸控裝置，避免手機鍵盤無預警彈出造成畫面劇烈位移）
      const isTouch = window.matchMedia('(pointer: coarse)').matches;
      if (!isTouch) {
        const input = document.getElementById(id).querySelector('input:not([type="hidden"])');
        if (input) setTimeout(() => input.focus(), 100);
      }
    }

    /** 設定特定 category-selector 的選中狀態 */
    function setCampusCategorySelector(modalType, categoryValue) {
      const containerId = (modalType === 'add') ? 'add-campus-category-selector' : 'edit-campus-category-selector';
      const container = document.getElementById(containerId);
      if (!container) return;
      const val = categoryValue || '高中';
      container.querySelectorAll('.category-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.cat === val);
      });
    }

    /** 選擇小排類別按鈕 */
    function selectCampusCategory(modalType, category) {
      setCampusCategorySelector(modalType, category);
    }

    /** 取得目前選中的小排類別 */
    function getSelectedCampusCategory(modalType) {
      const containerId = (modalType === 'add') ? 'add-campus-category-selector' : 'edit-campus-category-selector';
      const container = document.getElementById(containerId);
      if (!container) return '高中';
      const selected = container.querySelector('.category-btn.selected');
      return selected ? selected.dataset.cat : '高中';
    }

    /** 填充所屬校園下拉選單（僅列出國中與高中校園） */
    function populateCampusOptions(selectId, selectedValue) {
      const select = document.getElementById(selectId);
      if (!select) return;
      select.innerHTML = '<option value="">無 / 其他</option>';
      const schoolCampuses = state.campuses.filter(c => CampusDomain.isSchool(c));
      schoolCampuses.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${c.name} (${c.category})`;
        if (c.id === selectedValue) opt.selected = true;
        select.appendChild(opt);
      });
    }

    /** 設定特定 stage-selector 的選中狀態 */
    function setStageSelector(containerId, stageValue) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const val = stageValue || '其他';
      container.querySelectorAll('.stage-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.stage === val);
      });
    }

    /** 選擇學段按鈕 */
    function selectStage(modalType, stage) {
      const containerId = (modalType === 'add') ? 'add-stage-selector' : 'edit-stage-selector';
      setStageSelector(containerId, stage);
    }

    /** 取得目前選中的學段 */
    function getSelectedStage(modalType) {
      const containerId = (modalType === 'add') ? 'add-stage-selector' : 'edit-stage-selector';
      const container = document.getElementById(containerId);
      if (!container) return '其他';
      const selected = container.querySelector('.stage-btn.selected');
      return selected ? selected.dataset.stage : '其他';
    }

    /** 在 Modal 中切換所屬校園時，自動帶入該校園的分類作為學段預設值 */
    function handleSelectCampusInModal(modalType) {
      const selectId = (modalType === 'add') ? 'add-member-other-campus' : 'edit-member-other-campus';
      const select = document.getElementById(selectId);
      if (!select) return;
      const cid = select.value;
      if (cid) {
        const campus = state.campuses.find(c => c.id === cid) ||
                       (state.archivedCampuses && state.archivedCampuses.find(c => c.id === cid));
        if (campus && CampusDomain.isSchool(campus)) {
          const containerId = (modalType === 'add') ? 'add-stage-selector' : 'edit-stage-selector';
          setStageSelector(containerId, CampusDomain.getCat(campus));
        }
      }
    }

    /** 選擇身分 */
    function selectRole(btn) {
      document.querySelectorAll('#role-selector .role-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    /** 切換 Modal 內的預設參與選項 */
    function toggleDefaultSelection(btn) {
      btn.classList.toggle('selected');
    }

    /** 取得目前選中的預設參與選項清單 */
    function getSelectedDefaults(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return [];
      const selected = [];
      container.querySelectorAll('.default-toggle-btn.selected').forEach(btn => {
        selected.push(btn.dataset.type);
      });
      return selected;
    }

    /** 設定預設參與選項按鈕的選中狀態 */
    function setSelectedDefaults(containerId, defaultsList) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const list = Array.isArray(defaultsList) ? defaultsList : [];
      container.querySelectorAll('.default-toggle-btn').forEach(btn => {
        btn.classList.toggle('selected', list.includes(btn.dataset.type));
      });
    }

    /** 關閉 modal */
    function closeModal(id) {
      const modalEl = document.getElementById(id);
      if (modalEl) {
        modalEl.classList.remove('active');
      }

      // 若所有 modal 皆已關閉，恢復 body 滾動狀態與捲動位置
      if (!document.querySelector('.modal-backdrop.active')) {
        const restoreY = savedBodyScrollY;
        document.body.classList.remove('modal-open');
        document.body.style.top = '';
        window.scrollTo(0, restoreY);
      }

      // 清空 input
      if (modalEl) {
        const inputs = modalEl.querySelectorAll('input, select');
        inputs.forEach(el => {
          if (el.tagName === 'SELECT') el.selectedIndex = 0;
          else el.value = '';
        });
      }
    }

    /** 取得某週的週一日期 (依 weekOffset) */
    function getWeekMonday(offset) {
      const now = new Date();
      const day = now.getDay(); // 0=Sun, 1=Mon, ...
      const diff = day === 0 ? -6 : 1 - day; // 調整到本週一
      const monday = new Date(now);
      monday.setDate(now.getDate() + diff + (offset * 7));
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    /** 格式化日期為 YYYY-MM-DD */
    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    /** 格式化日期為顯示用 M/D */
    function formatDateDisplay(date) {
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    /** 取得當前選擇的週次字串（週一日期） */
    function getCurrentWeekStr() {
      return formatDate(getWeekMonday(state.weekOffset));
    }

    /** 設定當前校園與週次快取索引 (委派至 AttendanceStore 極速建構) */
    function filterAttendanceForWeek() {
      attendanceStore.setCurrentContext(state.currentCampusId, getCurrentWeekStr());
    }

    /** 取得週次顯示標籤 */
    function getWeekLabel() {
      const monday = getWeekMonday(state.weekOffset);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      let tag = '';
      if (state.weekOffset === 0) tag = '<span class="week-tag">本週</span>';
      else if (state.weekOffset === -1) tag = '<span class="week-tag">上週</span>';
      else if (state.weekOffset === 1) tag = '<span class="week-tag">下週</span>';
      return `${tag}${formatDateDisplay(monday)} ~ ${formatDateDisplay(sunday)}`;
    }

    /** 更新統計顯示 (委派至 AttendanceStore O(1) 統計) */
    function updateAttendanceCount() {
      const counts = attendanceStore.getWeekCounts();
      document.getElementById('attendance-count').textContent =
        `出席${counts.attend} / 禱告${counts.pray} / 福音${counts.gospel}`;
      updateSuspensionUI();
    }

    // ===== 小排暫停狀態管理 =====

    /** 判斷當前校園於當前週次是否處於「小排暫停」狀態 */
    function isCurrentWeekSuspended() {
      if (!state.currentCampusId) return false;
      const campus = (state.campuses || []).find(c => c.id === state.currentCampusId);
      if (!campus || !Array.isArray(campus.suspendedWeeks)) return false;
      const currentWeek = getCurrentWeekStr();
      return campus.suspendedWeeks.includes(currentWeek);
    }

    /** 更新「本週小排暫停」按鈕、成員卡片與套用預設按鈕之狀態 */
    function updateSuspensionUI() {
      const bar = document.getElementById('suspend-bar');
      const btn = document.getElementById('btn-suspend');
      const memberList = document.getElementById('member-list');
      const fabApply = document.getElementById('btn-apply-defaults');
      if (!bar || !btn) return;

      // 1. 人員編輯模式下隱藏小排暫停按鈕
      if (state.memberEditMode) {
        bar.style.display = 'none';
        if (memberList) memberList.classList.remove('suspended');
        return;
      }
      bar.style.display = 'flex';

      const isSuspended = isCurrentWeekSuspended();
      const counts = attendanceStore.getWeekCounts();
      const hasRecords = counts.attend > 0 || counts.pray > 0 || counts.gospel > 0;

      if (isSuspended) {
        // 狀態 B：已確認暫停
        btn.classList.add('is-suspended');
        btn.classList.remove('disabled');
        btn.innerHTML = '🚫 本週小排已暫停（點擊恢復點名）';
        btn.title = '點擊以取消小排暫停並恢復點名';

        if (memberList) memberList.classList.add('suspended');
        if (fabApply) {
          fabApply.classList.add('disabled');
          fabApply.setAttribute('aria-disabled', 'true');
        }
      } else {
        // 狀態 A：未暫停
        btn.classList.remove('is-suspended');
        btn.innerHTML = '⏸️ 本週小排暫停';

        if (hasRecords) {
          btn.classList.add('disabled');
          btn.title = '本週已有部分點名，請先清空點名紀錄才能設為暫停';
        } else {
          btn.classList.remove('disabled');
          btn.title = '設定本週小排暫停';
        }

        if (memberList) memberList.classList.remove('suspended');
        if (fabApply && !state.memberEditMode) {
          fabApply.classList.remove('disabled');
          fabApply.removeAttribute('aria-disabled');
        }
      }
    }

    /** 點擊【本週小排暫停】按鈕 */
    async function handleToggleSuspendClick() {
      if (!state.currentCampusId) return;

      const campusId = state.currentCampusId;
      const weekStr = getCurrentWeekStr();
      const campus = (state.campuses || []).find(c => c.id === campusId);
      if (!campus) return;

      if (!Array.isArray(campus.suspendedWeeks)) {
        campus.suspendedWeeks = [];
      }

      const currentlySuspended = campus.suspendedWeeks.includes(weekStr);
      const counts = attendanceStore.getWeekCounts();
      const hasRecords = counts.attend > 0 || counts.pray > 0 || counts.gospel > 0;

      // 防呆：若未暫停且已有紀錄，提示使用者清空
      if (!currentlySuspended && hasRecords) {
        showToast('本週已有部分點名，請先清空點名紀錄才能設為暫停', 'error');
        return;
      }

      if (getPendingSaveCount() > 0) {
        showToast('請等待背景點名儲存完成後再切換', 'error');
        return;
      }

      const targetSuspended = !currentlySuspended;

      // 樂觀更新 (Optimistic UI Update)
      if (targetSuspended) {
        if (!campus.suspendedWeeks.includes(weekStr)) {
          campus.suspendedWeeks.push(weekStr);
          campus.suspendedWeeks.sort();
        }
      } else {
        campus.suspendedWeeks = campus.suspendedWeeks.filter(w => w !== weekStr);
      }
      updateSuspensionUI();

      try {
        const res = await callServer('toggleCampusSuspension', campusId, weekStr, targetSuspended);
        if (res.success) {
          if (Array.isArray(res.suspendedWeeks)) {
            campus.suspendedWeeks = res.suspendedWeeks;
          }
          showToast(targetSuspended ? '已設定本週小排暫停' : '已取消本週小排暫停，恢復正常點名', 'success');
        } else {
          throw new Error(res.error || '伺服器儲存失敗');
        }
      } catch (e) {
        // Rollback
        if (currentlySuspended) {
          if (!campus.suspendedWeeks.includes(weekStr)) {
            campus.suspendedWeeks.push(weekStr);
            campus.suspendedWeeks.sort();
          }
        } else {
          campus.suspendedWeeks = campus.suspendedWeeks.filter(w => w !== weekStr);
        }
        updateSuspensionUI();
        showToast('操作失敗：' + e.message, 'error');
      }
    }

    // ===== google.script.run 的 Promise 包裝 =====
    /**
     * 包裝 Google Apps Script 非同步 RPC 呼叫為標準 Promise
     * @param {string} functionName 後端公開函式名稱
     * @param {...*} args 傳遞給後端函式之參數
     * @returns {Promise<*>}
     */
    function callServer(functionName, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(new Error('google.script.run 未定義'));
          return;
        }

        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((err) => {
            const msg = (err && err.message) ? err.message : String(err || '未知錯誤');
            reject(new Error(msg));
          });

        if (typeof runner[functionName] !== 'function') {
          reject(new Error(`後端函式「${functionName}」不存在。請確認已將 Code.gs 複製並在 Apps Script 部署為「新版本」！`));
          return;
        }

        runner[functionName](...args);
      });
    }

    // ===== AttendanceStore 前端深模組實例化 =====
    const attendanceStore = new AttendanceStore({
      apiClient: {
        batchUpdateAttendance: (...args) => callServer('batchUpdateAttendance', ...args),
        applyDefaultAttendance: (...args) => callServer('applyDefaultAttendance', ...args),
        getAttendanceHistory: (startWeek, endWeek) => callServer('getAttendanceHistory', '', startWeek, endWeek)
      },
      onSyncStatusChange: () => {
        updatePendingSaveIndicator();
      },
      onToast: (msg, type) => {
        showToast(msg, type);
      },
      debounceMs: 400,
      maxRetries: 3
    });

    // ===== MemberStore 前端深模組實例化 =====
    const memberStore = new MemberStore({
      apiClient: {
        applyMemberChanges: (...args) => callServer('applyMemberChanges', ...args)
      },
      getCurrentCampusId: () => state.currentCampusId,
      onSyncStatusChange: () => {
        updatePendingSaveIndicator();
      },
      onToast: (msg, type) => {
        showToast(msg, type);
      },
      onSuccess: (campusId, mergedMembers, affectedMembers) => {
        if (Array.isArray(mergedMembers)) {
          state.membersByCampus[campusId] = mergedMembers;
          if (state.currentCampusId === campusId) {
            state.members = mergedMembers;
            if (typeof renderMembers === 'function') renderMembers();
          }
        }
        if (Array.isArray(affectedMembers)) {
          affectedMembers.forEach(aff => {
            const list = state.membersByCampus[aff.campusId];
            if (Array.isArray(list)) {
              const target = list.find(m => m.name === aff.name);
              if (target) target.otherGroupId = aff.otherGroupId;
            }
          });
        }
      },
      onRollback: (campusId) => {
        if (state.currentCampusId === campusId) {
          state.membersByCampus[campusId] = state.members;
          if (typeof renderMembers === 'function') renderMembers();
        }
      },
      debounceMs: 400
    });

    // ===== CampusStore 前端深模組實例化 =====
    const campusStore = new CampusStore({
      apiClient: {
        applyCampusChanges: (...args) => callServer('applyCampusChanges', ...args)
      },
      getCurrentCampuses: () => ({
        campuses: state.campuses || [],
        archivedCampuses: state.archivedCampuses || []
      }),
      onSyncStatusChange: () => {
        updatePendingSaveIndicator();
      },
      onToast: (msg, type) => {
        showToast(msg, type);
      },
      onRollback: (rollback) => {
        if (rollback) {
          state.campuses = rollback.campuses;
          state.archivedCampuses = rollback.archivedCampuses;
          if (typeof renderCampuses === 'function') renderCampuses();
        }
      },
      debounceMs: 400
    });

    /** 計算目前所有正在防抖等待或背景儲存中的操作數 */
    function getPendingSaveCount() {
      let count = 0;
      if (typeof attendanceStore !== 'undefined') count += attendanceStore.getPendingCount();
      if (typeof memberStore !== 'undefined') count += memberStore.getPendingCount();
      else if (typeof getMemberPendingCount === 'function') count += getMemberPendingCount();
      if (typeof campusStore !== 'undefined') count += campusStore.getPendingCount();
      else if (typeof getCampusPendingCount === 'function') count += getCampusPendingCount();
      return count;
    }

    /** 更新背景儲存計數器指示燈 */
    function updatePendingSaveIndicator() {
      const count = getPendingSaveCount();
      let indicator = document.getElementById('pending-save');
      if (count > 0) {
        if (!indicator) {
          indicator = document.createElement('div');
          indicator.id = 'pending-save';
          document.body.appendChild(indicator);
        }

        indicator.textContent = `儲存中 (${count})...`;
        indicator.style.display = 'block';
      } else if (indicator) {
        indicator.style.display = 'none';
      }
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = { CampusDomain, state };
    }

// ===== 首頁：全域資料快取與載入 =====

    /** 將後端全域資料存入前端狀態並渲染首頁（0 毫秒極速載入） */
    function applyLoadedData(data) {
      if (!data) return;
      state.campuses = data.campuses || [];
      state.archivedCampuses = data.archivedCampuses || [];
      state.membersByCampus = data.membersByCampus || {};
      if (typeof sortMemberList === 'function') {
        Object.values(state.membersByCampus).forEach(list => sortMemberList(list));
      }
      attendanceStore.loadInitialData(data.attendanceByCampus || {}, data.minLoadedWeek || '');
      renderCampuses();
    }

    /** 從雲端非同步載入或刷新全域資料 */
    async function loadInitialDataFromCloud(showFeedback = false) {
      if (showFeedback) showLoading();
      try {
        const result = await callServer('getInitialAppData');
        if (result.success) {
          applyLoadedData(result.data);

          // 若當前在點名頁面，同步刷新當前校園
          if (state.currentCampusId) {
            state.members = state.membersByCampus[state.currentCampusId] || [];
            filterAttendanceForWeek();
            renderMembers();
            updateAttendanceCount();
          }

          if (showFeedback) showToast('已從雲端同步最新資料', 'success');
        } else {
          if (showFeedback) showToast('同步失敗：' + (result.error || '未知錯誤'), 'error');
        }

      } catch (e) {
        if (showFeedback) showToast('連線失敗：' + e.message, 'error');
      } finally {
        if (showFeedback) hideLoading();
      }
    }

    /**
     * 合併從後端取得的更早歷史點名資料 (委派至 AttendanceStore 頭部拼接)
     */
    function mergeAttendanceHistory(historyByCampus, newMinLoadedWeek) {
      attendanceStore.mergeAttendanceHistory(historyByCampus, newMinLoadedWeek);
      if (state.currentCampusId) {
        renderMembers();
        updateAttendanceCount();
      }
    }

    /**
     * 確保指定起始週（targetStartWeek）以上的點名資料已存在快取中 (委派至 AttendanceStore)
     */
    async function ensureAttendanceRange(targetStartWeek) {
      showLoading();
      try {
        const ok = await attendanceStore.ensureAttendanceRange(targetStartWeek);
        if (state.currentCampusId) {
          renderMembers();
          updateAttendanceCount();
        }
        return ok;
      } finally {
        hideLoading();
      }
    }

    /** 渲染校園列表（使用 DocumentFragment 批次組裝，避免 DOM 重繪） */
    function renderCampuses() {
      const container = document.getElementById('campus-list');

      // 更新首頁底部管理按鈕群組顯示狀態
      updateCampusFooterUI();

      if (state.campuses.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🏫</div>
            <p>尚無小排，點擊下方按鈕新增</p>
          </div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      // 依分類分組
      const groups = {};
      state.campuses.forEach(c => {
        const cat = c.category || '其他';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(c);
      });

      // 分組順序：高中 → 國中 → 社區排 → 其他
      const order = ['高中', '國中', '社區排', '其他'];
      order.forEach(cat => {
        if (!groups[cat] || groups[cat].length === 0) return;
        const title = document.createElement('div');
        title.className = 'group-title';
        title.textContent = cat;
        fragment.appendChild(title);
        const grid = document.createElement('div');
        grid.className = 'campus-grid';
        grid.dataset.category = cat;
        const sortedList = groups[cat].sort((a, b) => (a.sort || 0) - (b.sort || 0));
        sortedList.forEach((campus, index) => {
          const card = document.createElement('div');
          card.className = 'campus-card' + (state.campusEditMode ? ' edit-mode' : '');
          card.dataset.id = campus.id;
          card.dataset.name = campus.name;
          card.dataset.category = cat;

          // 校園名稱
          const nameEl = document.createElement('span');
          nameEl.className = 'campus-card-name';
          nameEl.textContent = campus.name;
          card.appendChild(nameEl);

          // 編輯小排按鈕
          const renameBadge = document.createElement('span');
          renameBadge.className = 'rename-badge';
          renameBadge.textContent = '✏️';
          renameBadge.title = '編輯小排';
          card.appendChild(renameBadge);

          // 刪除按鈕
          const deleteBadge = document.createElement('span');
          deleteBadge.className = 'delete-badge';
          deleteBadge.textContent = '✕';
          deleteBadge.title = '封存小排';
          card.appendChild(deleteBadge);

          // 編輯模式：左右/前後移動按鈕
          if (state.campusEditMode) {
            const reorderBar = document.createElement('div');
            reorderBar.className = 'campus-reorder-bar';

            // ◀ 前移按鈕
            const btnLeft = document.createElement('button');
            btnLeft.type = 'button';
            btnLeft.className = 'campus-reorder-btn';
            btnLeft.innerHTML = '◀';
            btnLeft.title = '往前移動一位';
            btnLeft.dataset.dir = '-1';
            if (index === 0) btnLeft.disabled = true;
            reorderBar.appendChild(btnLeft);

            // ▶ 後移按鈕
            const btnRight = document.createElement('button');
            btnRight.type = 'button';
            btnRight.className = 'campus-reorder-btn';
            btnRight.innerHTML = '▶';
            btnRight.title = '往後移動一位';
            btnRight.dataset.dir = '1';
            if (index === sortedList.length - 1) btnRight.disabled = true;
            reorderBar.appendChild(btnRight);
            card.appendChild(reorderBar);
          }

          grid.appendChild(card);
        });

        fragment.appendChild(grid);
      });

      if (container.replaceChildren) {
        container.replaceChildren(fragment);
      } else {
        container.innerHTML = '';
        container.appendChild(fragment);
      }
    }

    /** Campus List 全域事件委派（單一事件監聽，杜絕重複閉包與記憶體洩漏） */
    function initCampusListDelegation() {
      const container = document.getElementById('campus-list');
      if (!container) return;
      container.addEventListener('click', (e) => {
        const card = e.target.closest('.campus-card');
        if (!card) return;
        const campusId = card.dataset.id;
        const campusName = card.dataset.name;
        if (!campusId) return;

        // 改名按鈕
        const renameBtn = e.target.closest('.rename-badge');
        if (renameBtn) {
          e.stopPropagation();
          openRenameCampusModal(campusId, campusName);
          return;
        }

        // 刪除/封存按鈕
        const deleteBtn = e.target.closest('.delete-badge');
        if (deleteBtn) {
          e.stopPropagation();
          confirmDelete('小排', campusName, () => handleDeleteCampus(campusId, campusName));
          return;
        }

        // 排序按鈕 (◀ 前移 / ▶ 後移)
        const reorderBtn = e.target.closest('.campus-reorder-btn');
        if (reorderBtn) {
          e.stopPropagation();
          if (reorderBtn.disabled) return;
          const dir = parseInt(reorderBtn.dataset.dir, 10);
          if (dir) moveCampus(campusId, dir);
          return;
        }

        // 點擊卡片本體：進入點名頁（非編輯模式下）
        if (!state.campusEditMode) {
          enterAttendancePage(campusId, campusName);
        }
      });
    }

    /** 本地生成校園/小排流水號 ID (CAMP_xxx 或 COMM_xxx) */
    function generateLocalCampusId(category) {
      const isComm = CampusDomain.isCommunity(category);
      const prefix = isComm ? 'COMM_' : 'CAMP_';
      let maxNum = 0;
      const allList = [...state.campuses, ...(state.archivedCampuses || [])];
      const regex = isComm ? /^COMM_(\d+)$/ : /^CAMP_(\d+)$/;
      allList.forEach(c => {
        const match = String(c.id).match(regex);
        if (match) {
          const num = parseInt(match[1], 10);
          if (num > maxNum) maxNum = num;
        }
      });

      return prefix + String(maxNum + 1).padStart(3, '0');
    }

    /** 在同一分類中移動校園順序（0 毫秒立即重排） */
    function moveCampus(campusId, direction) {
      const campus = state.campuses.find(c => c.id === campusId);
      if (!campus) return;
      const category = campus.category || '其他';
      const categoryCampuses = state.campuses
        .filter(c => (c.category || '其他') === category)
        .sort((a, b) => (a.sort || 0) - (b.sort || 0));
      const idx = categoryCampuses.findIndex(c => c.id === campusId);
      if (idx === -1) return;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= categoryCampuses.length) return;

      // 交換兩者的 sort 屬性
      const tempSort = categoryCampuses[idx].sort;
      categoryCampuses[idx].sort = categoryCampuses[targetIdx].sort;
      categoryCampuses[targetIdx].sort = tempSort;
