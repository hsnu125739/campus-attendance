<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小排點名系統</title>
  
  <!-- 行動裝置 PWA / 主畫面獨立 App 體驗設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d9488">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d9488;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* 容器：撐滿畫面並裁切 Google 警告橫幅 */
    .app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      height: 100vh;
      overflow: hidden;
    }

    /* 
      iframe 核心裁切樣式：
      將 Google 橫幅 (-38px) 向上推擠出可視區域外
    */
    .gas-frame {
      width: 100%;
      height: calc(100dvh + 38px);
      height: calc(100vh + 38px);
      margin-top: -38px;
      border: none;
      display: block;
      background: white;
    }

    /* 載入中過渡動畫 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0d9488, #0f766e);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- 載入動畫層 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">小排點名系統載入中...</div>
  </div>

  <!-- 主內容容器 -->
  <div class="app-container">
    <iframe 
      id="gasFrame"
      class="gas-frame"
      src="https://script.google.com/macros/s/AKfycbzXRziqX8CEtSVXuIJNYXtBs3RqcQKHhxV8LKI9mrlYD7cyCaCi2E_r87WIXHvzwRNn_g/exec"
      allow="clipboard-write"
      onload="handleFrameLoad()">
    </iframe>
  </div>

  <script>
    function handleFrameLoad() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.classList.add('hidden');
      }
    }
    setTimeout(handleFrameLoad, 3500);
  </script>
</body>
</html>
